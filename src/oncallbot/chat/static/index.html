      const r = await api('/api/prompts');
      promptCatalog = await r.json();
      return promptCatalog;
    }

    function promptCta(surface, label) {
      return `<button class="promptcta" data-act="prompts" data-surface="${surface}"
        title="See and edit the prompt behind this">${label || 'Prompt'}</button>`;
    }

    async function openPrompts(surface) {
      const cat = await loadPromptCatalog();
      const items = (cat.surfaces || {})[surface] || [];
      document.getElementById('mtitle').textContent = 'Prompt';
      document.getElementById('msub').textContent =
        'Edited here for this tab only. A refresh restores the shipped wording.';
      document.getElementById('mlink').hidden = true;
      mbody.innerHTML = items.map((it, i) => `
        <div class="promptbox" data-key="${esc(it.key)}">
          <div class="promptlabel">${esc(it.label)}
            <span class="edited" ${promptEdits[it.key] ? '' : 'hidden'}>edited</span>
          </div>
          <textarea class="prompttext" spellcheck="false"
            aria-label="${esc(it.label)}">${esc(promptEdits[it.key] || it.text)}</textarea>
          <div class="promptrow">
            <button class="sumbtn" data-act="prompt-save" data-i="${i}">Use this</button>
            <button class="linkbtn" data-act="prompt-reset" data-i="${i}">Reset</button>
            <span class="hint promptnote"></span>
          </div>
        </div>`).join('') || '<div class="dxnote">No prompt for this yet.</div>';
      // The shipped text, for Reset.
      mbody._defaults = items.map(it => it.text);
      mbody._keys = items.map(it => it.key);
      openModal();
    }

    mbody.addEventListener('click', e => {
      const save = e.target.closest('button[data-act="prompt-save"]');
      const reset = e.target.closest('button[data-act="prompt-reset"]');
      if (!save && !reset) return;
      const btn = save || reset;
      const box = btn.closest('.promptbox');
      const area = box.querySelector('.prompttext');
      const note = box.querySelector('.promptnote');
      const key = box.dataset.key;
      const i = Number(btn.dataset.i);
      if (reset) {
        area.value = mbody._defaults[i];
        delete promptEdits[key];
        box.querySelector('.edited').hidden = true;
        note.textContent = 'Back to the shipped wording.';
        return;
      }
      const text = area.value.trim();
      if (!text) { note.textContent = 'An empty prompt would just use the default.'; return; }
      promptEdits[key] = text;
      box.querySelector('.edited').hidden = false;
      note.textContent = 'Used from your next question.';
    });

    // Remembered on the live object, because the element it belongs to is
    // replaced by the next delta.
    log.addEventListener('click', e => {
      const sum = e.target.closest('.thinking > summary');
      if (!sum) return;
      const det = sum.parentElement;
      let el = det;
      while (el && !el._live) el = el.parentElement;
      // The browser flips `open` after this handler, so the new state is the
      // opposite of what it reads right now.
      if (el) el._live.traceOpen = !det.open;
    });

    document.getElementById('routingprompt').onclick = () => openPrompts('routing');

    log.addEventListener('click', e => {
      const cta = e.target.closest('button[data-act="prompts"]');
      if (cta) { e.preventDefault(); openPrompts(cta.dataset.surface); }
    });

    function openModal() {
      lastFocus = document.activeElement;
      backdrop.hidden = false;
      document.body.style.overflow = 'hidden';
      document.getElementById('mclose').focus();
    }

    function closeModal() {
      backdrop.hidden = true;
      document.body.style.overflow = '';
      mbody.innerHTML = '';
      if (lastFocus) lastFocus.focus();
    }

    document.getElementById('mclose').onclick = closeModal;
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !backdrop.hidden) { e.preventDefault(); closeModal(); }
    });

    // Long bodies fold; the quoted tail is usually the least interesting part.
    const FOLD_CHARS = 900;

    function messageBlock(m, i, total) {
      const atts = (m.attachments || []).map(a =>
        `<span class="att" title="${esc(a.mime_type)}">${esc(a.filename)} · ${kb(a.size_bytes || 0)}</span>`).join('');
      const body = m.body || '(no text content)';
      const long = body.length > FOLD_CHARS;
      return `<div class="emsg">
    <div class="eh">
      <span class="num">${i + 1}/${total}</span>
      <span class="who">${esc(_name(m.from))}</span>
      <span class="when">${esc(fmtStamp(m.date))}</span>
    </div>
    <div class="addr">from ${copyable(m.from || '?', 'sender')}${m.to ? ` · to ${esc(m.to)}` : ''}${m.cc ? ` · cc ${esc(m.cc)}` : ''}</div>
    ${atts ? `<div style="margin-top:7px">${atts}</div>` : ''}
    <div class="ebody${long ? ' fold' : ''}">${esc(body)}</div>
    ${long ? `<button class="more2" data-act="unfold">Show full message</button>` : ''}
  </div>`;
    }

    function _name(addr) {
      addr = (addr || '').trim();
      if (addr.includes('<')) {
        const n = addr.split('<')[0].trim().replace(/^"|"$/g, '');
        return n || addr.split('<')[1].replace('>', '').trim();
      }
      return addr || 'unknown';
    }

    function fmtStamp(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString(undefined, {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    mbody.addEventListener('click', e => {
      const b = e.target.closest('button[data-act="unfold"]');
      if (!b) return;
      b.previousElementSibling.classList.remove('fold');
      b.remove();
    });

    async function showThread(threadId, subject) {
      document.getElementById('mtitle').textContent = subject || 'Thread';
      document.getElementById('msub').textContent = 'Loading from Gmail…';
      document.getElementById('mlink').hidden = false;
      document.getElementById('mlink').href = 'https://mail.google.com/mail/u/0/#all/' + threadId;
      mbody.innerHTML = THREAD_SKELETON;
      openModal();
      try {
        const r = await api(`/api/thread/${encodeURIComponent(threadId)}/messages`);
        if (!r.ok) {
          const d = await r.json().catch(() => ({ detail: r.statusText }));
          throw new Error(d.detail || ('HTTP ' + r.status));
        }
        const t = await r.json();
        document.getElementById('mtitle').innerHTML =
          copyable(t.subject || 'Thread', 'subject');
        document.getElementById('msub').textContent =
          `${t.messages.length} message${t.messages.length == 1 ? '' : 's'} · full text as received`;
        mbody.innerHTML = t.messages.map((m, i) => messageBlock(m, i, t.messages.length)).join('');
      } catch (err) {
        document.getElementById('msub').textContent = '';
        mbody.innerHTML = `<div class="emsg"><div class="sumerr">Could not load the thread: ${esc(err.message)}</div></div>`;
      }
    }

    // Delegated: cards are injected as HTML, so bind once on the log.
    // The summary is one JSON object being written, so the fields land in schema
    // order and each one is painted into its final place as it closes.
    async function streamSummary(card, btn, slot, signal) {
      const s = {};
      const live = { streaming: true, status: 'Summarizing…', field: '', trace: [] };
      // Reachable from the delegated click below, and survives repaints.
      slot._live = live;
      const paint = () => { slot.innerHTML = summaryPanel(s, live); };
      paint();

      for await (const [ev, payload] of sseEvents(
        '/api/summarize', { thread_id: card.dataset.thread }, signal)) {
        if (ev === 'trace') { live.trace.push(payload); paint(); }
        else if (ev === 'status') { live.status = payload; paint(); }
        else if (ev === 'delta') {
          if (payload.name !== 'summary' && payload.name !== 'issue') continue;
          s[payload.name] = (s[payload.name] || '') + payload.text;
          if (live.field !== payload.name) { live.field = payload.name; paint(); }
          const node = slot.querySelector(`[data-slot="${payload.name}"]`);
          if (node) node.innerHTML = payload.name === 'summary'
            ? formatBlocks(s.summary, true) : esc(s.issue);
          else paint();
        }
        else if (ev === 'field') {
          // severity and category complete the header row that is already there.
          if (payload.name === 'severity' || payload.name === 'category') {
            s[payload.name] = payload.value;
            paint();
          }
        }
        else if (ev === 'error') { throw new Error(payload); }
        else if (ev === 'summary') {
          // Not null: the trace is part of the panel now, and the finished
          // panel should still show how it got there.
          slot.innerHTML = summaryPanel(payload.summary, done(live));
          slot.dataset.loaded = '1';
          btn.textContent = 'Hide summary';
          btn.classList.add('cached');
          refreshStats();
          return;
        }
      }
      throw new Error('the summary stream ended without a summary');
    }

    async function streamDiagnosis(card, btn, slot, signal) {
      const ogid = btn.dataset.order || '';
      // Accumulated as the events arrive, then handed to the same renderer the
      // finished diagnosis uses. The closed/open read lands before any API call;
      // the checks land before a word of prose.
      const d = {
        verdict: '', checks: [], reason: '', other_findings: '',
        followup_question: '', followup_calls: [], followup_findings: ''
      };
      // Which prose is arriving. The server sends the followup event before its
      // first delta, so the deltas after it belong to the further check.
      const live = { streaming: true, status: 'Reading the thread…', stage: 'findings', trace: [] };
      slot._live = live;
      let text = '';
      const paint = () => { slot.innerHTML = diagnosisPanel(d, ogid, live); };
      paint();

      for await (const [ev, payload] of sseEvents('/api/diagnose',
        { thread_id: card.dataset.thread, order_group_id: ogid }, signal)) {
        if (ev === 'trace') { live.trace.push(payload); paint(); }
        else if (ev === 'status') { live.status = payload; paint(); }
        else if (ev === 'state') { Object.assign(d, payload); paint(); }
        else if (ev === 'checks') {
          d.checks = payload;
          // The verdict the badge shows is the checks, counted here -- the same
          // arithmetic the server did, so the badge cannot change under it.
          d.verdict = payload.some(c => !c.passed) ? 'mismatch' : 'match';
          paint();
        }
        else if (ev === 'followup') {
          d.followup_question = payload.question || '';
          d.followup_calls = payload.calls || [];
          live.stage = 'followup';
          text = '';
          paint();
        }
        else if (ev === 'delta') {
          text += payload;
          if (live.stage === 'followup') d.followup_findings = text;
          else if (d.verdict === 'mismatch') d.reason = text;
          else d.other_findings = text;
          const node = slot.querySelector(
            live.stage === 'followup' ? '[data-slot="followup"]' : '[data-slot="prose"]');
          if (node) node.innerHTML = formatBlocks(text, true);
          else paint();
        }
        else if (ev === 'needs_token') {
          // The token was refused mid-stream, so it cannot be the 401 that
          // the absent-token case returns. Same box either way, and the
          // caller retries the diagnosis once a new one is pasted.
          throw new NeedsToken(payload.detail || 'Admin token needed.');
        }
        else if (ev === 'error') { throw new Error(payload); }
        else if (ev === 'diagnosis') {
          noteDiagnosis(card.dataset.thread, payload.diagnosis);
          // Same renderer, real diagnosis: the prose is already where it will
          // stay, so this only fills in the sections below it.
          slot.innerHTML = diagnosisPanel(
            payload.diagnosis, payload.order_group_id, done(live));
          slot.dataset.loaded = '1';
          btn.textContent = 'Hide diagnosis';
          return;
        }
      }
      throw new Error('the diagnosis stream ended without a verdict');
    }

    log.addEventListener('click', async (e) => {
      const head = e.target.closest('.acchead');
      if (head) {
        const open = head.parentElement.classList.toggle('open');
        head.setAttribute('aria-expanded', open);
        return;
      }

      const readBtn = e.target.closest('button[data-act="read"]');
      if (readBtn) {
        const c = readBtn.closest('.tcard');
        showThread(c.dataset.thread, c.querySelector('h3').textContent);
        return;
      }

      const dxBtn = e.target.closest('button[data-act="diagnose"]');
      if (dxBtn) {
        const card = dxBtn.closest('.tcard');
        let slot = card.querySelector('.dxslot');
        if (!slot) { slot = document.createElement('div'); slot.className = 'dxslot'; card.appendChild(slot); }
        if (slot.dataset.loaded === '1') {
          const open = slot.style.display !== 'none';
          slot.style.display = open ? 'none' : '';
          dxBtn.textContent = open ? 'Diagnose' : 'Hide diagnosis';
          return;
        }
        // A second click while it runs is Stop, not a second diagnosis.
        if (dxBtn.dataset.running === '1') {
          dxBtn._stop && dxBtn._stop();
          return;
        }
        const was = dxBtn.dataset.label || dxBtn.textContent;
        dxBtn.dataset.label = was;
        const ctl = new AbortController();
        dxBtn.dataset.running = '1';
        dxBtn._stop = () => ctl.abort();
        dxBtn.textContent = 'Stop';
        dxBtn.classList.add('stopping');
        try {
          await streamDiagnosis(card, dxBtn, slot, ctl.signal);
        } catch (err) {
          if (isAbort(err)) {
            slot.innerHTML = `<div class="dxwrap"><div class="dxnote">Stopped.</div></div>`;
            dxBtn.textContent = was;
          } else if (err instanceof NeedsToken) {
            slot.innerHTML = '';
            dxBtn.textContent = was;
            askForToken(err.message, () => dxBtn.click());
          } else {
            slot.innerHTML = `<div class="dxwrap"><div class="sumerr">Could not diagnose: ${esc(err.message)}</div></div>`;
            dxBtn.textContent = was;
          }
        } finally {
          delete dxBtn.dataset.running;
          dxBtn._stop = null;
          dxBtn.classList.remove('stopping');
        }
        return;
      }

      const btn = e.target.closest('button[data-act="summarize"]');
      if (!btn) return;
      const card = btn.closest('.tcard');
      const slot = card.querySelector('.slot');
      const id = card.dataset.thread;

      if (slot.dataset.loaded === '1') {        // toggle an already-fetched summary
        const open = slot.style.display !== 'none';
        slot.style.display = open ? 'none' : '';
        btn.textContent = open ? 'Show summary' : 'Hide summary';
        return;
      }

      if (btn.dataset.running === '1') {
        btn._stop && btn._stop();
        return;
      }
      const was = btn.dataset.label || btn.textContent;
      btn.dataset.label = was;
      const ctl = new AbortController();
      btn.dataset.running = '1';
      btn._stop = () => ctl.abort();
      btn.textContent = 'Stop';
      btn.classList.add('stopping');
      try {
        await streamSummary(card, btn, slot, ctl.signal);
      } catch (err) {
        if (isAbort(err)) {
          // Whatever arrived is discarded: a half-written summary is not one.
          slot.innerHTML = `<div class="sumwrap"><div class="dxnote">Stopped.</div></div>`;
          btn.textContent = was;
        } else if (err instanceof NeedsToken) {
          slot.innerHTML = '';
          btn.textContent = was;
          askForToken(err.message, () => btn.click());
        } else {
          slot.innerHTML = `<div class="sumwrap"><div class="sumerr">Could not summarize: ${esc(err.message)}</div></div>`;
          btn.textContent = was;
        }
      } finally {
        delete btn.dataset.running;
        btn._stop = null;
        btn.classList.remove('stopping');
      }
    });

    async function ask(message) {
      if (busy || !message.trim()) return;
      finishTyping();
      // They just sent it, so they want to see it -- whatever they were
      // reading a moment ago.
      stickToBottom = true;
      busy = true; setSendMode('stop'); input.value = ''; input.style.height = 'auto';

      bubble(turn(), 'me', message);
      const t = turn();
      const statusEl = document.createElement('div');
      statusEl.className = 'status'; statusEl.textContent = '…';
      t.appendChild(statusEl); scroll();

      const ctl = new AbortController();
      inFlight = ctl;

      let res;
      try {
        res = await api('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: history.slice(-MAX_HISTORY), prompts: promptEdits }),
          signal: ctl.signal
        });
      } catch (e) {
        statusEl.remove();
        if (isAbort(e)) bubble(t, 'bot', 'Stopped.').classList.add('stopped');
        else bubble(t, 'bot err', 'Could not reach the server: ' + e.message);
        inFlight = null; busy = false; setSendMode('send'); input.focus();
        if (pending) { const next = pending; pending = null; ask(next); }
        return;
      }

      if (!res.ok) {
        // Anything but a stream: say what the server said rather than parsing a
        // JSON error as if it were SSE and showing nothing.
        const d = await res.json().catch(() => ({ detail: 'HTTP ' + res.status }));
        statusEl.remove();
        bubble(t, 'bot err', d.detail || ('HTTP ' + res.status));
        inFlight = null; busy = false; setSendMode('send'); input.focus();
        if (pending) { const next = pending; pending = null; ask(next); }
        return;
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      const lines = [];
      let answerEl = null, cardWrap = null, streamedCards = 0, needsToken = null;
      // The markdown as it arrives. Rendering replaces the element's
      // contents, so the text has to be kept separately.
      let answerRaw = '';
      const turnRecord = { message, action: '', params: {}, reply: '', rows: [] };

      let stopped = false;
      while (true) {
        let value, done;
        try {
          ({ value, done } = await reader.read());
        } catch (e) {
          // An abort lands here. Whatever streamed stays on screen, labelled.
          if (!isAbort(e)) throw e;
          stopped = true;
          break;
        }
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const chunks = buf.split('\n\n'); buf = chunks.pop();
        for (const chunk of chunks) {
          let ev = 'message', data = '';
          for (const line of chunk.split('\n')) {
            if (line.startsWith('event: ')) ev = line.slice(7).trim();
            else if (line.startsWith('data: ')) data += line.slice(6);
          }
          if (!data) continue;
          let payload; try { payload = JSON.parse(data); } catch { continue; }

          if (ev === 'intent') {
            turnRecord.action = payload.action || '';
            turnRecord.params = {
              days: payload.days, after: payload.after, before: payload.before,
              severities: payload.severities, categories: payload.categories,
              search: payload.search, limit: payload.limit,
              // Without this the router was told the last turn was an
              // order_lookup but not which order, so "analyze the data" had
              // nothing to continue and fell back to searching Gmail.
              order_group_id: payload.order_group_id,
            };
          } else if (ev === 'status') {
            lines.push(payload);
            statusEl.textContent = lines.slice(-6).join('\n');
            scroll();
          } else if (ev === 'trace') {
            traceInto(t, payload);
            scroll();
          } else if (ev === 'needs_token') {
            // Not an error: the question was fine, we just cannot answer it yet.
            // Same paste box as the cards use, then ask again for them.
            statusEl.remove();
            needsToken = payload;
          } else if (ev === 'error') {
            if (!answerEl) statusEl.remove();
            bubble(t, 'bot err', payload);
            turnRecord.reply = 'error: ' + payload;
          } else if (ev === 'summary') {
            // A card the moment its thread finishes, rather than all at the end.
            if (!cardWrap) { cardWrap = document.createElement('div'); cardWrap.className = 'cards'; t.appendChild(cardWrap); }
            cardWrap.insertAdjacentHTML('beforeend', summaryCard(payload));
            streamedCards++;
            scroll();
          } else if (ev === 'delta') {
            // Model prose, token by token.
            if (!answerEl) {
              statusEl.remove();
              answerEl = bubble(t, 'bot', '');
              answerEl.classList.add('streaming', 'rich');
            }
            answerRaw += payload;
            // The bullets, bold and code resolve as they arrive rather than
            // all at once at the end. formatBlocks leaves only the line still
            // being typed escaped, so a half-written '**' cannot flicker --
            // and because the finished message uses the same renderer, there
            // is nothing left to rebuild when the stream stops.
            answerEl.innerHTML = formatBlocks(answerRaw, true);
            scroll();
          } else if (ev === 'result') {
            const shownRows = (payload.threads && payload.threads.length) ? payload.threads
              : ((payload.summaries && payload.summaries.length) ? payload.summaries : null);
            if (shownRows) turnRecord.rows = shownRows.map(compactRow);
            if (answerEl) {
              answerEl.classList.remove('streaming');
              // Only the last line's marks change here; every line above it is
              // already in its final form.
              answerEl.innerHTML = sourceBadge(payload.source)
                + formatBlocks(payload.text || answerRaw, false)
                + promptCta('followup', 'Prompt used');
              turnRecord.reply = (payload.text || '').slice(0, 600);
            } else {
              statusEl.textContent = lines.slice(-2).join('\n');
              if (!statusEl.textContent) statusEl.remove();
              const b = bubble(t, 'bot', '');
              b.classList.add('rich');
              b.innerHTML = sourceBadge(payload.source)
                + formatBlocks(payload.text || '(no response)', false)
                + promptCta('followup', 'Prompt used');
              turnRecord.reply = (payload.text || '').slice(0, 600);
              if (cardWrap) t.appendChild(cardWrap);  // keep cards below the summary line
              const threads = (payload.threads && payload.threads.length) ? payload.threads : null;
              if (threads) {
                const wrap = document.createElement('div');
                wrap.innerHTML = (payload.groups && payload.groups.length)
                  ? groupedList(payload.groups, threads) : threadList(threads);
                b.after(wrap);
              } else if (!streamedCards && payload.summaries && payload.summaries.length) {
                // No cards were streamed (cached-only path); render them now.
                const wrap = document.createElement('div'); wrap.className = 'cards';
                wrap.innerHTML = payload.summaries.map(summaryCard).join('');
                b.after(wrap);
              }
            }
            scroll();
          }
        }
      }
      if (needsToken) {
        // Nothing to record: the turn never ran. Retried verbatim once a token
        // is in, so the person does not have to retype the question.
        inFlight = null; busy = false; setSendMode('send');
        askForToken(needsToken.detail, () => ask(needsToken.retry || message));
        return;
      }
      if (stopped) {
        statusEl.remove();
        if (answerEl) {
          answerEl.classList.remove('streaming');
          answerEl.classList.add('stopped');
          answerEl.insertAdjacentHTML('beforeend',
            '<div class="stopnote">Stopped — this answer is incomplete.</div>');
        } else {
          bubble(t, 'bot', 'Stopped.').classList.add('stopped');
        }
        // An interrupted turn is not context: a follow-up must not inherit half
        // an answer, or a window that was never actually read.
        turnRecord.reply = '(stopped by the user)';
        turnRecord.rows = [];
      }
      if (!turnRecord.reply) turnRecord.reply = '(no reply)';
      history.push(turnRecord);
      if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
      renderHistoryState();
      inFlight = null; busy = false; setSendMode('send'); input.focus(); refreshStats();
      // Instantly from the turn, then from the model when it comes back.
      const quick = localSuggestions();
      if (quick) {
        const chat = activeChat();
        if (chat) chat.suggestions = quick;
        renderChips(quick);
      }
      refreshSuggestions();
      if (pending) {
        const next = pending;
        pending = null;
        ask(next);
      }
    }

    // --- which model answers ---------------------------------------------
    // Per session, chosen here rather than by editing config.yaml. Only the
    // options that would actually work are offered: the list comes from the
    // server probing for `claude`, for an API key, and for whatever the local
    // server has pulled.
    const ENGINE_KEY = 'oncallbot.engine';
    const engineSel = document.getElementById('engine');
    let engines = [];

    function engineValue(e) {
      return e.id + '|' + (e.model || '');
    }

    function renderEngines(list, current) {
      engines = list || [];
      engineSel.innerHTML = '';
      if (!engines.length) { engineSel.hidden = true; return; }
      engineSel.hidden = false;

      const wanted = (() => {
        try { return localStorage.getItem(ENGINE_KEY) || ''; } catch { return ''; }
      })();
      const currentValue = current ? current.backend + '|' + (current.model || '') : '';

      engines.forEach(e => {
        const o = document.createElement('option');
        o.value = engineValue(e);
        o.textContent = e.label + (e.available ? '' : ' — unavailable');
        o.disabled = !e.available;
        o.title = e.why || e.note || '';
        engineSel.appendChild(o);
      });

      // The remembered choice, else whatever the server is actually using.
      const pick = engines.find(e => engineValue(e) === wanted && e.available)
        || engines.find(e => engineValue(e) === currentValue)
        || engines.find(e => e.available);
      if (pick) { engineSel.value = engineValue(pick); markEngine(pick); }
      // If the remembered one is gone -- a model deleted, a key unset -- tell
      // the server what we actually fell back to rather than leaving them
      // disagreeing.
      if (pick && engineValue(pick) !== currentValue) applyEngine(pick, true);
    }

    function markEngine(engine) {
      const dot = document.getElementById('enginedot');
      dot.className = 'enginedot ' + (engine.id === 'local' ? 'local' : 'cloud');
      dot.title = engine.note || engine.label;
      fitEngineWidth();
    }

    // A select sizes itself to its LONGEST option, so the pill stayed as wide
    // as "Anthropic API (...) - unavailable" and a short label left ~48px of
    // dead space before the chevron. Nothing else on the row moves when this
    // changes: the picker is left-aligned and the actions are right-aligned.
    function fitEngineWidth() {
      const s = document.getElementById('engine');
      const opt = s.options[s.selectedIndex];
      if (!opt) return;
      const cs = getComputedStyle(s);
      const probe = document.createElement('span');
      probe.style.cssText =
        'position:absolute;visibility:hidden;white-space:pre;font:' + cs.font;
      probe.textContent = opt.textContent;
      document.body.appendChild(probe);
      const textW = probe.getBoundingClientRect().width;
      probe.remove();
      // text + the space reserved for the dot and the chevron + borders.
      const w = Math.ceil(textW) + 25 + 28 + 2;
      s.style.width = Math.min(w, 210) + 'px';
    }

    async function applyEngine(engine, quiet) {
      try {
        const r = await api('/api/session', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ backend: engine.id, model: engine.model || '' })
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        try { localStorage.setItem(ENGINE_KEY, engineValue(engine)); } catch { }
        if (!quiet) {
          toast('Answers now come from ' + engine.label
            + (engine.note ? ' — ' + engine.note : ''));
        }
      } catch (e) {
        if (!quiet) toast('Could not switch model: ' + e.message);
      }
    }

    engineSel.onchange = () => {
      const engine = engines.find(e => engineValue(e) === engineSel.value);
      if (engine) { markEngine(engine); applyEngine(engine); }
    };

    function renderChips(list) {
      const box = document.getElementById('chips');
      box.innerHTML = '';
      (list && list.length ? list : SUGGESTIONS).forEach(text => {
        const b = document.createElement('button');
        b.className = 'chip';
        // textContent, not innerHTML: these come from a model reading
        // untrusted email, and a chip is not a place for markup.
        b.textContent = text;
        b.onclick = () => askOrQueue(text);
        box.appendChild(b);
      });
      markChipOverflow();
    }

    // Fade the right edge while there is anything past it, and drop the fade
    // once the row is scrolled to the end -- otherwise the last chip stays
    // half-faded when it is in fact the last one.
    function markChipOverflow() {
      const box = document.getElementById('chips');
      const room = box.scrollWidth - box.clientWidth;
      box.classList.toggle('more', room > 4 && box.scrollLeft < room - 4);
    }

    document.getElementById('chips').addEventListener('scroll', markChipOverflow);
    window.addEventListener('resize', markChipOverflow);

    // What the last turn makes obvious, without asking anyone. The model call
    // below is better, but it takes 20-40s on the CLI backend, and chips that
    // arrive after the user has moved on are no use -- so these land with the
    // answer and are replaced when the model answers.
    function localSuggestions() {
      const last = history[history.length - 1];
      if (!last) return null;
      const rows = last.rows || [];
      const order = (rows.find(r => (r.order_ids || []).length) || {}).order_ids;
      const po = order && order[0];
      const out = [];

      if (last.action === 'fetch' && rows.length) {
        out.push('Divide these into categories', 'How many of those are closed',
          'Show me the P0s and P1s');
        if (po) out.push('Diagnose ' + po);
      } else if (last.action === 'summarize' || last.action === 'categorize') {
        out.push('How many of those are closed', 'Show me the P0s and P1s',
          'What is the most common issue');
      } else if (last.action === 'order_lookup') {
        if (po) out.push('What bookings are on ' + po,
          'Was the patient record edited for ' + po,
          'Give me the report link for ' + po);
      } else if (last.action === 'context') {
        out.push('Summarize the open ones', 'Show me the P0s and P1s');
      }
      return out.length ? out.slice(0, 5) : null;
    }

    // After a turn, ask what is worth doing next. Deliberately after: it is a
    // hint, and it must not delay the answer. A failure or an empty answer
    // leaves the chips exactly as they were.
    async function refreshSuggestions() {
      const chat = activeChat();
      if (!history.length) return;
      try {
        const r = await api('/api/suggest', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'next', history: history.slice(-MAX_HISTORY) })
        });
        if (!r.ok) return;
        const { suggestions } = await r.json();
        if (!suggestions || !suggestions.length) return;
        // Only if the user is still in the chat these were derived from.
        if (activeChat() !== chat) return;
        if (chat) chat.suggestions = suggestions;
        renderChips(suggestions);
      } catch { /* the chips it has are fine */ }
    }

    async function refreshStats() {
      try {
        const c = await (await api('/api/context')).json();
        document.getElementById('addr').textContent = c.support_address + (c.mailbox ? ' via ' + c.mailbox : '');
        HAS_HELP_VIDEO = !!c.help_video;
        renderEngines(c.engines, c.engine);
        const out = document.getElementById('signout');
        if (c.user && c.auth_enabled) {
          out.hidden = false;
          out.textContent = 'Sign out';
          out.title = 'Signed in as ' + c.user;
        }
        document.getElementById('foot').textContent = (c.auth_enabled
          ? `Signed in as ${c.user}. Reads happen as you.`
          : 'Localhost only, no authentication.')
          + ' Summaries derive from patient data — see docs/deploy.md before exposing this.';
        const sev = c.by_severity || {};
        const order = ['p0', 'p1', 'p2', 'p3'];
        document.getElementById('stats').innerHTML =
          `<span>${c.cached} cached</span>` +
          order.filter(k => sev[k]).map(k => `<span class="pill ${k}">${k.toUpperCase()} ${sev[k]}</span>`).join('');
        return c;
      } catch { return null; }
    }

    (async function init() {
      const c = await refreshStats();
      greetingText = c
        ? `Hi 👋, I'm Triage an oncall bot for the ${c.support_address === "health-record-support@1mg.com" ? "Health Record Support" : c.support_address}. Ask me about oncall raised on mail or any order related info — try one of the suggestions below.`
        : 'Could not load context. Is config.yaml present?';
      document.getElementById('greeting').textContent = greetingText;
      renderChips(SUGGESTIONS);
      syncSend();
      // The session starts with one chat rather than none, so switching back
      // to the first conversation works like switching to any other.
      newChat(true);
      renderHistoryState();
      input.focus();
    })();

    function renderHistoryState() {
      if (typeof renderChatList === 'function' && !document.getElementById('chatpanel').hidden) {
        renderChatList();
      }
      const b = document.getElementById('newchat');
      b.disabled = busy;
      b.textContent = history.length ? `New chat (${history.length} turn${history.length > 1 ? 's' : ''})` : 'New chat';
    }

    // Several chats in one session. Each keeps its own transcript and its own
    // conversation memory, so switching back to one and carrying on works --
    // a follow-up like "how many of those are closed" resolves against the
    // rows that chat displayed, not whatever the other one was doing.
    //
    // Held in memory only. The transcripts contain patient-derived summaries,
    // and putting those in localStorage would be new PHI at rest for a
    // convenience nobody asked for; a reload starts fresh.
    let chats = [];
    let activeId = null;
    let chatSeq = 0;

    // --- the greeting types itself -------------------------------------
    //
    // Only ever the greeting: a real answer already streams from the model at
    // whatever rate the model produces, and pacing that artificially would be
    // pretending to think.
    let typing = null;

    function typeInto(el, text) {
      finishTyping();
      // Array.from, not text[i]: "Hi 👋" holds a surrogate pair, and slicing
      // it by index puts half a code point on screen.
      const chars = Array.from(text);
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (still || chars.length > 400) { el.textContent = text; return; }

      el.textContent = '';
      el.classList.add('typing');
      const state = { el, text, i: 0, id: 0 };
      typing = state;
      state.id = setInterval(() => {
        // Two at a time: one per tick reads as slow at this length, and the
        // eye cannot separate them anyway.
        state.el.textContent += chars.slice(state.i, state.i + 2).join('');
        state.i += 2;
        if (state.i >= chars.length) finishTyping();
        else scroll();
      }, 16);
    }

    // Put the whole text up and stop. Called whenever the greeting stops
    // being the thing the user is waiting on -- they typed, they asked, or
    // the chat is being stashed (a half-typed greeting must not be what gets
    // stored and restored).
    function finishTyping() {
      if (!typing) return;
      const state = typing;
      typing = null;
      clearInterval(state.id);
      state.el.textContent = state.text;
      state.el.classList.remove('typing');
    }

    // --- what the turn did, as it did it ---------------------------------
    //
    // A trace, not the model's private reasoning: we stream content deltas and
    // nothing else, and the local models emit no reasoning channel at all.
    // What it honestly holds is the prompt each call used, the reads that went
    // out with their parameters, and the steps around them -- which is what
    // you need to see why an answer came out the way it did.
    function traceRow(e) {
      if (e.kind === 'prompt') {
        return `<div class="trow">
          <span class="tkind tprompt">prompt</span>
          <span class="tlabel">${esc(e.label || e.key || '')}</span>
          ${e.edited ? '<span class="tedited">edited</span>' : ''}
          <span class="tmeta">${e.chars || 0} chars</span>
          ${e.text ? `<details class="tdetail"><summary>show</summary><pre>${esc(e.text)}</pre></details>` : ''}
        </div>`;
      }
      if (e.kind === 'tool') {
        const params = e.params ? Object.entries(e.params)
          .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join('  ') : '';
        return `<div class="trow">
          <span class="tkind ttool">${esc(e.method || 'read')}</span>
          <span class="tlabel">${esc(e.label || '')}</span>
          ${params ? `<code class="tparams">${esc(params)}</code>` : ''}
        </div>`;
      }
      return `<div class="trow">
        <span class="tkind">step</span>
        <span class="tlabel">${esc(e.label || '')}</span></div>`;
    }

    // Rendered INSIDE the panel it explains, under its header, so the steps sit
    // with the summary or diagnosis they produced rather than floating above
    // the card. The panel is rebuilt on every paint, so this has to be part of
    // its markup -- a node injected beside it would be wiped by the next
    // delta. `traceOpen` rides on the live object for the same reason: the
    // <details> element itself does not survive a repaint.
    // The finished panel, still carrying what it took to get there. Passing
    // null here used to be how "not streaming any more" was said, and that
    // would now throw the trace away at the moment it is most worth reading.
    function done(live) {
      return { streaming: false, trace: live.trace, traceOpen: live.traceOpen };
    }

    function traceBlock(live) {
      const rows = (live && live.trace) || [];
      if (!rows.length) return '';
      const n = rows.length;
      return `<details class="thinking"${live.traceOpen ? ' open' : ''}>
        <summary><span class="tsum">Thinking</span>
          <span class="tcount">${n} ${n === 1 ? 'step' : 'steps'}</span></summary>
        <div class="tbody">${rows.map(traceRow).join('')}</div>
      </details>`;
    }

    // One accordion per turn, built on the first entry and appended to after.
    function traceInto(turnEl, entry) {
      let box = turnEl.querySelector('.thinking');
      if (!box) {
        box = document.createElement('details');
        box.className = 'thinking';
        box.innerHTML = '<summary><span class="tsum">Thinking</span>'
          + '<span class="tcount"></span></summary><div class="tbody"></div>';
        // Above the answer: it is what led to it.
        turnEl.insertBefore(box, turnEl.firstChild);
      }
      box.querySelector('.tbody').insertAdjacentHTML('beforeend', traceRow(entry));
      const n = box.querySelectorAll('.trow').length;
      box.querySelector('.tcount').textContent =
        n + (n === 1 ? ' step' : ' steps');
      return box;
    }

    function greetingBubble() {
      const t = turn();
      const d = document.createElement('div');
      d.className = 'msg bot';
      t.appendChild(d);
      typeInto(d, greetingText || 'New chat. Ask me about the inbox or an order.');
    }

    function activeChat() {
      return chats.find(c => c.id === activeId) || null;
    }

    function stash() {
      finishTyping();
      const chat = activeChat();
      if (!chat) return;
      chat.html = log.innerHTML;
      chat.history = history;
      chat.draft = input.value;
    }

    function chatTitle(chat) {
      const first = (chat.history.find(h => h.message) || {}).message || '';
      if (!first) return 'Empty chat';
      return first.length > 38 ? first.slice(0, 35) + '…' : first;
    }

    function newChat(quiet) {
      // A turn in flight belongs to the chat being left, and its appends would
      // land in the new one.
      stopInFlight();
      stash();
      const chat = {
        id: ++chatSeq, history: [], html: '', draft: '',
        suggestions: null, at: Date.now()
      };
      chats.push(chat);
      activeId = chat.id;
      history = [];
      log.innerHTML = '';
      greetingBubble();
      renderChips(SUGGESTIONS);
      input.value = ''; input.style.height = 'auto'; input.focus();
      renderHistoryState();
      renderChatList();
      if (!quiet) toast('Started a new chat');
    }

    function switchChat(id) {
      if (id === activeId) { closeChatPanel(); return; }
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      stopInFlight();
      stash();
      activeId = id;
      history = chat.history;
      log.innerHTML = chat.html;
      renderChips(chat.suggestions);
      input.value = chat.draft || '';
      input.style.height = 'auto';
      renderHistoryState();
      renderChatList();
      closeChatPanel();
      scroll();
      input.focus();
      toast('Switched to: ' + chatTitle(chat));
    }

    function renderChatList() {
      const box = document.getElementById('chatitems');
      box.innerHTML = chats.map(c => {
        const turns = c.id === activeId ? history.length : c.history.length;
        return `<button class="chatitem${c.id === activeId ? ' active' : ''}" data-chat="${c.id}">
          <span class="t">${esc(c.id === activeId ? chatTitle({ history }) : chatTitle(c))}</span>
          <span class="n">${turns} turn${turns === 1 ? '' : 's'}${c.id === activeId ? ' · current' : ''}</span>
        </button>`;
      }).join('');
      const btn = document.getElementById('chatlist');
      btn.textContent = chats.length > 1 ? `Chats (${chats.length})` : 'Chats';
    }

    function closeChatPanel() {
      document.getElementById('chatpanel').hidden = true;
    }

    document.getElementById('newchat').onclick = () => newChat();
    document.getElementById('chatnew').onclick = () => { newChat(); closeChatPanel(); };
    document.getElementById('chatlist').onclick = (e) => {
      e.stopPropagation();
      const panel = document.getElementById('chatpanel');
      renderChatList();
      panel.hidden = !panel.hidden;
    };
    document.getElementById('chatitems').onclick = (e) => {
      const item = e.target.closest('[data-chat]');
      if (item) switchChat(Number(item.dataset.chat));
    };
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('chatpanel');
      if (panel.hidden) return;
      if (!panel.contains(e.target) && e.target.id !== 'chatlist') closeChatPanel();
    });

    // Asking something new mid-answer is the common case, so Enter stops the
    // current turn and sends the new question rather than being ignored.
    let pending = null;

    function askOrQueue(message) {
      if (!message.trim()) return;
      if (!busy) { ask(message); return; }
      pending = message;
      input.value = ''; input.style.height = 'auto';
      stopInFlight();
    }

    function syncSend() {
      // Never disabled while a turn runs: it is the Stop button then.
      send.disabled = !busy && !input.value.trim();
    }

    function setSendMode(mode) {
      // Runs at both ends of a turn, which is exactly when the button's
      // reason to exist changes.
      setTimeout(syncJump, 0);
      send.textContent = mode === 'stop' ? 'Stop' : 'Send';
      send.classList.toggle('stop', mode === 'stop');
      send.title = mode === 'stop' ? 'Stop this answer (Esc)' : '';
      syncSend();
    }

    send.onclick = () => {
      if (busy) { stopInFlight(); return; }
      ask(input.value);
    };

    // Esc stops whatever is streaming, from anywhere on the page.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !backdrop.hidden) return;   // the modal owns Esc
      if (stopDictation()) return;
      if (stopInFlight()) return;
      const running = document.querySelector('[data-running="1"]');
      if (running && running._stop) running._stop();
    });
    document.getElementById('signout').addEventListener('click', async () => {
      try {
        await fetch('/auth/logout', { method: 'POST' });
      } catch { }
      location.replace('/login?err=logged_out');
    });

    // --- dictation -----------------------------------------------------------
    // The browser's own recognizer, so there is nothing to install and no
    // audio endpoint of ours. Note where the audio goes: Chrome sends it to
    // Google's speech service, Safari to Apple's. An order id spoken aloud
    // leaves the machine the same way a typed one does not -- see docs/phi.md.
    // Where that is not acceptable, the alternative is a local Whisper behind
    // an endpoint of our own; this button is deliberately easy to swap.
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = document.getElementById('mic');
    let recognizer = null;
    let dictating = false;
    let dictationBase = '';
    let dictationFinal = '';

    function micState(on) {
      dictating = on;
      mic.classList.toggle('live', on);
      mic.setAttribute('aria-pressed', String(on));
      mic.title = on ? 'Stop dictating' : 'Dictate your question';
    }

    function stopDictation() {
      if (!recognizer || !dictating) return false;
      // onend does the tidying, so the two paths cannot disagree.
      try { recognizer.stop(); } catch { micState(false); }
      return true;
    }

    function startDictation() {
      if (!SpeechRec) return;
      recognizer = new SpeechRec();
      // Indian English: the mailbox, the names and the order ids are all local.
      recognizer.lang = document.documentElement.lang === 'en' ? 'en-IN' : (document.documentElement.lang || 'en-IN');
      recognizer.continuous = true;      // a long question is not cut short
      recognizer.interimResults = true;  // the words appear as they are said

      // Appended to whatever is typed, never replacing it: dictation is for
      // adding to a question, including one half-written.
      dictationBase = input.value ? input.value.replace(/\s*$/, '') + ' ' : '';
      dictationFinal = '';

      recognizer.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const chunk = event.results[i][0].transcript;
          if (event.results[i].isFinal) dictationFinal += chunk;
          else interim += chunk;
        }
        input.value = (dictationBase + dictationFinal + interim).replace(/\s+/g, ' ').trimStart();
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 150) + 'px';
      };

      recognizer.onerror = (event) => {
        micState(false);
        const why = {
          'not-allowed': 'Microphone access was refused. Allow it in the browser, then try again.',
          'service-not-allowed': 'The browser blocked speech recognition for this page.',
          'no-speech': 'Did not hear anything.',
          'audio-capture': 'No microphone found.',
          'network': 'Speech recognition needs a network connection.',
        }[event.error] || ('Dictation failed: ' + event.error);
        toast(why);
      };

      recognizer.onend = () => {
        micState(false);
        input.focus();
      };

      try {
        recognizer.start();
        micState(true);
        toast('Listening — click the mic again to stop');
      } catch {
        micState(false);
        toast('Could not start dictation');
      }
    }

    if (SpeechRec) {
      // Shown only where it works. A dead button is worse than no button, and
      // Firefox has no implementation at all.
      mic.hidden = false;
      mic.onclick = () => { if (!stopDictation()) startDictation(); };
    }


    document.getElementById('jump').onclick = () => { scroll(true); input.focus(); };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askOrQueue(input.value); }
    });
    input.addEventListener('input', () => {
      // They are already typing their own question; stop performing.
      finishTyping();
      syncSend();
      input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    });

    /* --- theme ---
       Three states, not two: "follow the OS" is a real preference and not the
       same as choosing light, so cycling goes system -> light -> dark -> system.
       Only an explicit pick is stored; landing back on system clears the key. */
    (function () {
      const KEY = 'oncallbot.theme';
      const ORDER = ['system', 'light', 'dark'];
      const ICON = { system: '◐', light: '☀', dark: '☾' };
      const btn = document.getElementById('theme');
      const icon = document.getElementById('themeicon');
      const mq = matchMedia('(prefers-color-scheme: dark)');

      function read() {
        try {
          const v = localStorage.getItem(KEY);
          return ORDER.includes(v) ? v : 'system';
        } catch { return 'system'; }
      }

      function apply(mode) {
        if (mode === 'system') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = mode;
        icon.textContent = ICON[mode];
        const label = mode === 'system'
          ? 'Theme: system (' + (mq.matches ? 'dark' : 'light') + ')'
          : 'Theme: ' + mode;
        const next = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length];
        btn.title = label + ' \u2014 switch to ' + next;
        btn.setAttribute('aria-label', btn.title);
      }

      btn.addEventListener('click', () => {
        const next = ORDER[(ORDER.indexOf(read()) + 1) % ORDER.length];
        try {
          if (next === 'system') localStorage.removeItem(KEY);
          else localStorage.setItem(KEY, next);
        } catch { }
        apply(next);
      });

      // In system mode the CSS already follows along; this only keeps the
      // button's label honest about which way the OS resolved.
      mq.addEventListener('change', () => { if (read() === 'system') apply('system'); });

      apply(read());
    })();
  </script>
</body>

</html>
