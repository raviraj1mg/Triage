<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oncallbot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20stroke-width%3D%222.6%22%3E%3Cpath%20stroke%3D%22%23c0243a%22%20d%3D%22M3%206.5h4.2l1.7-3.2%202%206.4%201.3-3.2H21%22%2F%3E%3Cpath%20stroke%3D%22%23d9722b%22%20d%3D%22M3%2013.5h11%22%2F%3E%3Cpath%20stroke%3D%22%23a8871f%22%20d%3D%22M3%2020h7%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <script>
    // Before first paint, or the reader watches the page change colour under them.
    // Only an explicit pick is stored -- no key means "follow the OS".
    try {
      var t = localStorage.getItem('oncallbot.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>
  <style>
    /* --- theme ---
   Light is the base palette. Dark applies when the OS asks for it *and* the
   reader has not pinned light, and again when they have pinned dark -- so the
   header toggle wins in both directions instead of only being able to darken
   an already-light OS. The two dark blocks must stay in step: CSS has no way
   to share one declaration list between a media query and an attribute
   selector, so this duplication is the price of an override that works. */
    :root {
      color-scheme: light;
      --bg: #f7f7f8;
      --panel: #fff;
      --ground: #fff;
      --sunk: #f1f2f4;
      --ink: #16181d;
      --muted: #6b7280;
      --line: #e3e5e9;
      --accent: #2f5fe0;
      --accent-soft: #eaf0ff;
      --on-accent: #fff;
      --ok: #1a7a4c;
      --ok-soft: #e4f3ea;
      --p0: #c0243a;
      --p1: #d9722b;
      --p2: #a8871f;
      --p3: #6b7280;
      --p0bg: #fdeaed;
      --p1bg: #fdf0e6;
      --p2bg: #fbf6e3;
      --p3bg: #f1f2f4;
      --scrim: rgba(8, 9, 12, .62);
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1b1e24;
        --ground: #14161a;
        --sunk: #22262d;
        --ink: #e8eaee;
        --muted: #9aa1ad;
        --line: #2b2f37;
        --accent: #7ea2ff;
        --accent-soft: #1e2740;
        --on-accent: #10131a;
        --ok: #5fcf95;
        --ok-soft: #16301f;
        --p0: #ff8494;
        --p1: #ffb072;
        --p2: #e2c65c;
        --p3: #9aa1ad;
        --p0bg: #331b20;
        --p1bg: #33261a;
        --p2bg: #302b18;
        --p3bg: #23262c;
        --scrim: rgba(0, 0, 0, .66);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14161a;
      --panel: #1b1e24;
      --ground: #14161a;
      --sunk: #22262d;
      --ink: #e8eaee;
      --muted: #9aa1ad;
      --line: #2b2f37;
      --accent: #7ea2ff;
      --accent-soft: #1e2740;
      --on-accent: #10131a;
      --ok: #5fcf95;
      --ok-soft: #16301f;
      --p0: #ff8494;
      --p1: #ffb072;
      --p2: #e2c65c;
      --p3: #9aa1ad;
      --p0bg: #331b20;
      --p1bg: #33261a;
      --p2bg: #302b18;
      --p3bg: #23262c;
      --scrim: rgba(0, 0, 0, .66);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.01em
    }

    header .addr {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted)
    }

    header .stats {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .pill {
      background: var(--p3bg);
      border-radius: 999px;
      padding: 2px 9px;
      font-weight: 600
    }

    .reset {
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer
    }

    .reset:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .reset:disabled {
      opacity: .4;
      cursor: default
    }

    .themebtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px
    }

    .themebtn .ti {
      font-size: 13px;
      line-height: 1.15;
      width: 1em;
      text-align: center
    }

    .pill.p0 {
      background: var(--p0bg);
      color: var(--p0)
    }

    .pill.p1 {
      background: var(--p1bg);
      color: var(--p1)
    }

    .pill.p2 {
      background: var(--p2bg);
      color: var(--p2)
    }

    .pill.p3 {
      background: var(--p3bg);
      color: var(--p3)
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .turn {
      max-width: 900px;
      width: 100%;
      margin: 0 auto
    }

    .msg {
      padding: 11px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere
    }

    /* A bubble holding rendered markdown rather than raw prose.
       pre-wrap plus block markup is what made the token box twice as tall as
       its content; formatBlocks emits no newlines of its own, so this opts
       out and lets the <p> and <ul> do the spacing. */
    /* The panel headers exist because readers could not tell where a summary
       ended and a diagnosis began -- both are plain panels under a card. */
    /* Closed by default: it explains an answer rather than being one. */
    .thinking {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 6px 10px;
      font-size: 12px
    }

    .thinking>summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted)
    }

    .thinking>summary::-webkit-details-marker {
      display: none
    }

    .thinking>summary::before {
      content: "▸";
      font-size: 10px
    }

    .thinking[open]>summary::before {
      content: "▾"
    }

    .tsum {
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: 10.5px
    }

    .tcount {
      font-size: 11px;
      opacity: .8
    }

    .tbody {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .trow {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 7px;
      padding: 3px 0;
      border-top: 1px solid var(--line)
    }

    .tkind {
      font-family: var(--mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--p3bg);
      color: var(--muted);
      flex: none
    }

    .tkind.tprompt {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .tkind.ttool {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .tlabel {
      color: var(--ink)
    }

    .tedited {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent)
    }

    .tmeta {
      color: var(--muted);
      font-size: 11px
    }

    .tparams {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      word-break: break-all
    }

    .tdetail {
      flex-basis: 100%
    }

    .tdetail>summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 11px
    }

    .tdetail pre {
      white-space: pre-wrap;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      margin: 6px 0 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg);
      max-height: 260px;
      overflow: auto
    }

    .panelhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line)
    }

    .panelname {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted)
    }

    /* Quiet until wanted: this is a tool for when an answer is wrong, not
       something to read past on every card. */
    .promptcta {
      font: inherit;
      font-size: 11.5px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer
    }

    .promptcta:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .msg .promptcta {
      margin-top: 9px
    }

    .promptbox {
      margin-bottom: 16px
    }

    .promptlabel {
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .promptlabel .edited {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--on-accent);
      background: var(--accent);
      padding: 1px 6px;
      border-radius: 999px
    }

    .prompttext {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink)
    }

    .promptrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px
    }

    .promptrow .hint {
      white-space: normal;
      overflow: visible;
      padding-top: 0
    }

    .linkbtn {
      font: inherit;
      font-size: 12px;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline
    }

    .msg.rich {
      white-space: normal
    }

    .msg.rich p {
      margin: 6px 0
    }

    /* No padding of its own at the ends -- the bubble already has some. */
    .msg.rich p:first-of-type {
      margin-top: 0
    }

    .msg.rich p:last-of-type {
      margin-bottom: 0
    }

    .msg code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--p3bg);
      padding: 1px 5px;
      border-radius: 4px
    }

    .msg pre.block {
      margin: 6px 0;
      padding: 9px 11px;
      border-radius: 8px;
      background: var(--p3bg);
      overflow-x: auto;
      white-space: pre
    }

    .msg pre.block code {
      background: none;
      padding: 0;
      font-size: 12.5px
    }

    .msg strong {
      font-weight: 650
    }

    .src {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .02em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 7px
    }

    .src.gmail {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .src.cache {
      background: var(--p2bg);
      color: var(--p2)
    }

    .src.api {
      background: var(--ok-soft, var(--p3bg));
      color: var(--ok, var(--accent))
    }

    .src.ctx {
      background: var(--p3bg);
      color: var(--muted)
    }

    .me {
      background: var(--accent-soft);
      border: 1px solid var(--line);
      margin-left: auto;
      max-width: 78%;
      width: fit-content
    }

    .bot {
      background: var(--panel);
      border: 1px solid var(--line)
    }

    .status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      padding: 2px 0 2px 14px;
      border-left: 2px solid var(--line);
      margin: 4px 0 4px 2px;
      white-space: pre-wrap;
      overflow-wrap: anywhere
    }

    .err {
      background: var(--p0bg);
      color: var(--p0);
      border: 1px solid var(--p0)
    }

    .streaming::after {
      content: '▍';
      color: var(--accent);
      animation: blink 1s steps(2) infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      /* Content that cannot wrap is clipped to the card rather than drawn
         over whatever is beside it. */
      overflow: hidden;
      min-width: 0
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 14.5px;
      font-weight: 650;
      display: flex;
      gap: 9px;
      align-items: baseline;
      flex-wrap: wrap
    }

    .card h3 .sub {
      font-weight: 500
    }

    .cat {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted)
    }

    .cstate {
      margin-top: 7px
    }

    .card .issue {
      margin: 6px 0
    }

    .card .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .card .meta a {
      color: var(--accent)
    }

    /* A flex row that wraps, rather than inline chips with no break
       opportunity between them: `join('')` made the whole run one unbreakable
       inline box, so a row of plain numeric ids -- no hyphen to break at --
       ran straight out of the card. Hyphenated PB ids wrapped, which is why
       it looked like only some data escaped. */
    .ids {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
      min-width: 0
    }

    .ids code {
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--p3bg);
      padding: 1px 5px;
      border-radius: 4px;
      max-width: 100%;
      overflow-wrap: anywhere
    }

    /* --- date group heading --- */
    .daygroup {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 2px
    }

    .daygroup:first-child {
      margin-top: 2px
    }

    .daygroup .d {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .daygroup .rel {
      font-size: 11.5px;
      color: var(--muted);
      opacity: .75
    }

    .daygroup .rule {
      flex: 1;
      height: 1px;
      background: var(--line)
    }

    .acc {
      margin-top: 12px
    }

    .acc:first-child {
      margin-top: 2px
    }

    .acchead {
      width: 100%;
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
      text-align: left;
      font: inherit;
      color: var(--ink);
      background: none;
      border: 0;
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer
    }

    .acchead:hover {
      background: var(--p3bg)
    }

    .acchead:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px
    }

    .acchead .chev {
      display: inline-block;
      width: 10px;
      font-size: 12px;
      color: var(--muted);
      transition: transform .12s ease
    }

    .acc.open .acchead .chev {
      transform: rotate(90deg)
    }

    .acchead .lbl {
      font-size: 13px;
      font-weight: 700
    }

    .acchead .n {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px
    }

    .acchead .desc {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      flex: 1;
      min-width: 140px
    }

    .acc>.cards {
      margin-top: 6px
    }

    .acc:not(.open)>.cards {
      display: none
    }

    /* --- thread card (no LLM) --- */
    .tcard {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      overflow: hidden;
      min-width: 0
    }

    .tcard .top {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .tcard h3 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 650;
      flex: 1;
      overflow-wrap: anywhere
    }

    .tcard .time {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 2px
    }

    .tcard .who {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 5px
    }

    .tcard .who b {
      font-weight: 600;
      color: var(--ink)
    }

    .tcard .snip {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      max-height: 4.7em;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      position: relative
    }

    .tcard .snip.clamped::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5em;
      background: linear-gradient(to bottom, transparent, var(--panel))
    }

    .tcard .foot {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 11px
    }

    .tcard .foot a {
      font-size: 12px;
      color: var(--accent)
    }

    .chipm {
      font-size: 11px;
      color: var(--muted);
      background: var(--p3bg);
      border-radius: 999px;
      padding: 2px 8px;
      display: inline-flex;
      gap: 5px;
      align-items: center
    }

    .att {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--p3bg);
      border-radius: 4px;
      padding: 1px 6px;
      margin: 2px 4px 0 0;
      display: inline-block
    }

    .att[data-copy] {
      cursor: copy
    }

    .att[data-copy]:hover {
      border-color: var(--accent);
      color: var(--accent)
    }


    .sumbtn {
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      margin-left: auto
    }

    .sumbtn:hover:not(:disabled) {
      background: var(--accent-soft)
    }

    .sumbtn:disabled {
      opacity: .55;
      cursor: default
    }

    .sumbtn.cached {
      border-color: var(--line);
      color: var(--muted)
    }

    /* --- summary panel revealed inside a card --- */
    .sumwrap {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px dashed var(--line);
      min-width: 0;
      overflow-wrap: anywhere
    }

    .sumwrap .hdr {
      display: flex;
      gap: 9px;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 6px
    }

    .pill.pending {
      background: var(--p3bg);
      color: var(--muted)
    }

    .sumwrap .issue {
      margin: 6px 0
    }

    .sumerr {
      font-size: 12.5px;
      color: var(--p0)
    }

    /* --- skeleton --- */
    .sk {
      background: linear-gradient(90deg, var(--p3bg) 25%, var(--line) 37%, var(--p3bg) 63%);
      background-size: 400% 100%;
      animation: sh 1.3s ease-in-out infinite;
      border-radius: 6px;
      height: 11px;
      margin: 7px 0
    }

    @keyframes sh {
      0% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0 50%
      }
    }

    .sk.w20 {
      width: 20%
    }

    .sk.w35 {
      width: 35%
    }

    .sk.w60 {
      width: 60%
    }

    .sk.w80 {
      width: 80%
    }

    .sk.w95 {
      width: 95%
    }

    .sklabel {
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 4px
    }

    /* --- text arriving from the model --- */
    .live {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px
    }

    .live.tail::after,
    .tail:empty::after {
      content: '\258d';
      color: var(--accent);
      animation: blink 1s steps(2) infinite
    }

    .tail li:last-child::after,
    .tail p:last-child::after {
      content: ' \258d';
      color: var(--accent);
      animation: blink 1s steps(2) infinite
    }

    .live:empty {
      display: none
    }

    .livemeta {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 6px
    }

    .pts {
      margin: 6px 0 0;
      padding-left: 19px
    }

    .pts li {
      margin: 4px 0
    }

    .pts li.sub {
      list-style: circle;
      margin-left: 14px
    }

    .pts+.pts {
      margin-top: 2px
    }

    .sumtext {
      font-size: 13.5px
    }

    .sumtext:empty,
    .livemeta:empty {
      display: none
    }

    .dxsec p,
    .sumwrap p {
      margin: 6px 0
    }

    .dxwait {
      margin-top: 9px;
      font-style: italic
    }

    /* .msg is pre-wrap so streamed prose keeps its newlines. This box is
       built from an indented template, and under pre-wrap every one of those
       newlines rendered as blank space -- 445px of box for 185px of content.
       It is markup, not prose, so it opts out. */
    .tokenask {
      white-space: normal
    }

    .tokenask .tokhead {
      font-size: 14px;
      margin-bottom: 6px
    }

    /* The bare .hint is the one-line footer under the composer: nowrap, with
       an ellipsis. This one is a paragraph, and inheriting that truncated it
       mid-sentence -- 890px of message in a 790px box. */
    .tokenask .hint {
      font-size: 12.5px;
      color: var(--muted);
      white-space: normal;
      overflow: visible;
      text-overflow: clip
    }

    /* formatBlocks emits <p>, whose default margins are what made this box
       twice as tall as it needed to be. */
    .tokenask .hint p {
      margin: 2px 0
    }

    .tokenask .hint p:first-child {
      margin-top: 0
    }

    .tokenask a {
      color: var(--accent);
      text-decoration: underline
    }

    .tokenask .tokrow {
      display: flex;
      gap: 8px;
      margin-top: 10px
    }

    .tokenask .tokfoot {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 9px
    }

    .videocta {
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      gap: 7px;
      align-items: center
    }

    .videocta:hover {
      background: var(--accent);
      color: #fff
    }

    .tokenask input {
      flex: 1;
      font: inherit;
      font-size: 13px;
      font-family: var(--mono);
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink)
    }

    .tokenask input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px
    }

    .helpvid video {
      width: 100%;
      max-height: 70vh;
      border-radius: 10px;
      background: #000;
      display: block
    }

    .helpvid .hint {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--muted)
    }

    /* The greeting types itself out, so the first thing on screen behaves
       like the thing it is -- a bot that is about to answer. A caret while it
       runs, and nothing left behind once it stops. */
    .msg.typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 2px;
      vertical-align: -0.15em;
      background: var(--accent);
      animation: caret 1s step-end infinite
    }

    @keyframes caret {
      0%, 100% { opacity: 1 }
      50% { opacity: 0 }
    }

    /* Someone who has asked the OS for less motion gets the text at once. */
    @media (prefers-reduced-motion: reduce) {
      .msg.typing::after { animation: none }
    }

    .enginewrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-width: 0
    }

    /* Which kind of model is answering, visible without reading the label:
       amber for one running on this machine, accent for a hosted one. */
    .enginedot {
      position: absolute;
      left: 11px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      pointer-events: none
    }

    .enginedot.local {
      background: var(--p1);
      box-shadow: 0 0 0 3px var(--p1bg)
    }

    .enginedot.cloud {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft)
    }

    /* The native arrow sits in the 999px corner curve with barely any room
       beside it, which reads as clipped. Drawn ourselves instead, so it can be
       placed against the straight part of the pill. */
    #engine {
      font: inherit;
      font-size: 12px;
      max-width: 210px;
      padding: 0 28px 0 25px;
      transition: width .12s;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-overflow: ellipsis;
      appearance: none;
      -webkit-appearance: none
    }

    .enginewrap::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 5px;
      height: 5px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
      transition: border-color .15s
    }

    #engine:hover,
    .enginewrap:hover #engine {
      border-color: var(--accent);
      color: var(--accent)
    }

    .enginewrap:hover::after {
      border-color: var(--accent)
    }

    .mic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer
    }

    .mic:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .mic.live {
      border-color: var(--p0);
      background: var(--p0bg);
      color: var(--p0);
      animation: micpulse 1.4s ease-in-out infinite
    }

    @keyframes micpulse {
      50% {
        opacity: .55
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    #send.stop {
      background: var(--p0bg);
      border: 1px solid var(--p0);
      color: var(--p0)
    }

    .sumbtn.stopping,
    .dxbtn.stopping {
      border-color: var(--p0);
      color: var(--p0)
    }

    .msg.stopped {
      opacity: .85
    }

    .stopnote {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      font-style: italic
    }

    .fcalls {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 7px 0 3px
    }

    .fcall {
      font-size: 12px;
      color: var(--muted)
    }

    .fcall .fp {
      font-family: var(--mono);
      font-size: 11px;
      opacity: .8
    }

    .fcall.none {
      font-style: italic
    }

    /* --- diagnose --- */
    .dxbtn {
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--ok, #1a7a4c);
      background: transparent;
      color: var(--ok, #1a7a4c);
      cursor: pointer
    }

    .dxbtn:hover:not(:disabled) {
      background: var(--ok-soft, rgba(26, 122, 76, .12))
    }

    .dxbtn:disabled {
      opacity: .55;
      cursor: default
    }

    .dxwrap {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px dashed var(--line);
      min-width: 0;
      overflow-wrap: anywhere
    }

    .vd {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 2px 9px;
      margin-right: 7px
    }

    .vd.mismatch {
      background: var(--p0bg);
      color: var(--p0)
    }

    .vd.match {
      background: var(--ok-soft, var(--p3bg));
      color: var(--ok, var(--muted))
    }

    .vd.indeterminate {
      background: var(--p2bg);
      color: var(--p2)
    }

    .vd.closed {
      background: var(--p3bg);
      color: var(--muted)
    }

    .vd.open {
      background: var(--p1bg);
      color: var(--p1)
    }

    .cmp {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 9px
    }

    .cmp th {
      text-align: left;
      font-size: 10.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      padding: 3px 8px 3px 0
    }

    .cmp td {
      padding: 3px 8px 3px 0;
      border-top: 1px solid var(--line);
      overflow-wrap: anywhere
    }

    .cmp td.v {
      font-family: var(--mono);
      font-size: 11.5px
    }

    .cmp .no {
      color: var(--p0);
      font-weight: 650
    }

    .cmp .yes {
      color: var(--ok, var(--muted))
    }

    .tl {
      font-size: 12.5px;
      margin-top: 9px
    }

    .tl .h {
      font-weight: 650;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .tl li {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted)
    }

    .steps {
      margin: 9px 0 0 0;
      padding-left: 1.2rem;
      font-size: 13px
    }

    .steps li {
      margin: 3px 0
    }

    .dxtrail {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      opacity: .8;
      margin-top: 8px
    }

    .checks {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .checks li {
      display: grid;
      grid-template-columns: 1.15rem 1fr;
      gap: 0 .6rem;
      align-items: start;
      font-size: 13px
    }

    .checks .mk {
      font-weight: 700;
      line-height: 1.5
    }

    .checks .mk.ok {
      color: var(--ok, #1a7a4c)
    }

    .checks .mk.no {
      color: var(--p0)
    }

    .checks .lbl {
      font-weight: 600
    }

    .checks .why {
      grid-column: 2;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      overflow-wrap: anywhere
    }

    .dxnote {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 8px
    }

    .dxsec {
      margin-top: 11px
    }

    .dxsec .h {
      font-weight: 650;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px
    }

    /* Identifiers read as code wherever they appear. */
    .dxwrap code,
    .sumwrap code,
    .tcard code {
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--sunk, var(--p3bg));
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: .05em .32em
    }

    .idpill {
      font-family: var(--mono)
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    /* --- click-to-copy ---
   No buttons and no glyphs: the thing itself is the control. What remains as
   affordance is the copy cursor, a hover tint and a title, plus a tick and a
   toast on success -- discoverable without adding a widget beside every id.
   The tick is CSS generated content, so it never lands in the copied text. */
    code {
      cursor: copy;
      transition: background .12s, border-color .12s, color .12s
    }

    code:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    code.copied {
      border-color: var(--ok, var(--accent));
      color: var(--ok, var(--accent))
    }

    code.copied::after {
      content: ' \2713';
      opacity: 1
    }

    /* Longer text that is copyable too: subjects, senders, filenames. */
    [data-copy] {
      cursor: copy
    }

    .urlink {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      white-space: nowrap
    }

    .urlink .ext {
      font-size: .85em;
      margin-left: 2px;
      opacity: .7
    }

    .urlink:hover {
      text-decoration-thickness: 2px
    }

    .copytext:hover {
      text-decoration: underline dotted;
      text-underline-offset: 3px
    }

    [data-copy]:hover {
      color: var(--accent)
    }

    [data-copy].copied::after {
      content: ' \2713';
      color: var(--ok, var(--accent))
    }

    #chatpanel {

    }

      margin-bottom: 8px
    }

    .chatitem {

      background: none;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 7px 9px;

    }

    .chatitem:hover {

    }

    .chatitem.active {

    }

    }

    .chatitem .n {

    #chatpanel .hint {

    }

    #toast {

    }

    #toast.show {

    }

    /* --- read-thread button --- */
    .readbtn {
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer
    }

    .readbtn:hover {

      color: var(--accent)
    }

    .foot .sumbtn {
      margin-left: 0
    }

    .foot .spacer {
      flex: 1
    }

    .backdrop {

      inset: 0;
      background: var(--scrim);

      align-items: center;
      justify-content: center;

    }

    }

    .modal .mhead .sub {

    }

    .modal .mhead a {

      color: var(--accent);

    }

    .xbtn {

      font-size: 18px;

      border: 1px solid var(--line);

      color: var(--muted);

    }

    .xbtn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .mbody {
      overflow-y: auto;
      padding: 6px 18px 18px
    }

    .emsg {
      border-bottom: 1px solid var(--line);
      padding: 14px 0

    .emsg:last-child {
      border-bottom: 0
    }

    .emsg .eh {
      display: flex;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap
    }

    .emsg .who {
      font-size: 13px;
      font-weight: 650
    }

    .emsg .when {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      margin-left: auto;

    }

    .emsg .addr {

    }

    }

      font-size: 12px;

      color: var(--accent);
      background: 0;

    }

    .emsg .num {

      color: var(--muted)
    }

    }

    .jump:hover {

    }

    footer {
      position: relative;
      border-top: 1px solid var(--line);
      background: var(--bg);
      padding: 12px 20px 10px
    }

    /* One surface with the controls inside it, rather than four boxes in a row
       trying to line up: they had four different paddings and heights, which
       is what looked crooked. Nothing here aligns to anything else now --
       the shell is the alignment. */
    .composer {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
      transition: border-color .15s, box-shadow .15s
    }

      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 1px 2px rgba(0, 0, 0, .04)
    }

    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px
    }

    /* One height for everything on that row. */
    .composer-bar #engine,
    .composer-actions .mic,
    .composer-actions #send {
      height: 34px;
      box-sizing: border-box
    }

    textarea {
      width: 100%;
      resize: none;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      padding: 3px 2px;
      border: 0;
      background: transparent;
      color: var(--ink);
      min-height: 24px;
      max-height: 150px
    }

    textarea::placeholder {
      color: var(--muted)
    }

    /* The shell owns the focus ring, so the field must not draw its own. */
    textarea:focus {
      outline: none
    }

    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 10px;
      border: 0;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer
    }

    #send {
      padding: 0 18px;
      border-radius: 999px;
      font-size: 13.5px
    }

    /* Nothing to send is a state worth showing, rather than a click that
       quietly does nothing. */
    #send:disabled {
      opacity: .45;
      cursor: default
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    /* One row that scrolls, not a block that grows: the suggestions change
       every turn, and a footer that changes height with them makes the
       transcript jump. */
    .chips {
      max-width: 900px;
      margin: 0 auto 9px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px
    }

    .chips::-webkit-scrollbar {
      display: none
    }

    /* The row scrolls with no scrollbar, so without this the only hint that
       there are more chips is one clipped mid-word at the edge. Set by JS and
       only when it actually overflows, so a row that fits is not faded for
       nothing. */
    .chips.more {
      mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent)
    }

    .chips .chip {
      flex: 0 0 auto
    }

    .chip {
      font-size: 12.5px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .hint {
      max-width: 900px;
      margin: 0 auto;
      font-size: 11px;
      color: var(--muted);
      opacity: .8;
      padding-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .noVerticalScroll {
      overflow-y: hidden;
    }

    .botname {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* The mark: three bars sorted by length -- the priority lanes this tool
       puts oncalls into -- with the top one carrying a pulse for the health
       records they are about. It is drawn from --p0/--p1/--p2, the same
       tokens the severity pills use, so the logo is made of the severities
       the tool sorts by rather than a colour invented for it.
       Decorative: the word "Triage" is right beside it. */
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .mark {
      display: block;
      flex: none;
      overflow: visible;
    }
  </style>
</head>

<body class="noVerticalScroll">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
          <path stroke="var(--p0, #c0243a)" d="M3 6.5h4.2l1.7-3.2 2 6.4 1.3-3.2H21"/>
          <path stroke="var(--p1, #d9722b)" d="M3 13.5h11"/>
          <path stroke="var(--p2, #a8871f)" d="M3 20h7"/>
        </g>
      </svg>
      <div class="botname">
        <h1>Triage</h1>
        <span class="addr">oncallbot</span>
      </div>
    </div>
    <span class="addr" id="addr" style="display: none;"></span>
    <div class="stats" id="stats" style="visibility: hidden;"></div>
    <button id="theme" class="reset themebtn" type="button"><span class="ti" id="themeicon"
        aria-hidden="true">◐</span></button>
    <button id="routingprompt" class="reset"
      title="See and edit the prompt that decides what each message becomes">Routing prompt</button>
    <button id="chatlist" class="reset" title="Switch between this session's chats">Chats</button>
    <button id="newchat" class="reset" title="Start another chat, keeping this one">New chat</button>
    <button id="signout" class="reset" hidden>Sign out</button>
  </header>

  <div id="log">
    <div class="turn">
      <div class="msg bot" id="greeting">Loading…</div>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="modal" id="modal">
      <div class="mhead">
        <div style="flex:1">
          <h2 id="mtitle">Thread</h2>
          <div class="sub" id="msub"></div>
        </div>
        <a id="mlink" href="#" target="_blank" rel="noopener">open in Gmail</a>
        <button class="xbtn" id="mclose" aria-label="Close">×</button>
      </div>
      <div class="mbody" id="mbody"></div>
    </div>
  </div>

  <div id="chatpanel" hidden role="dialog" aria-label="Chats in this session">
    <div class="chatpanel-head">
      <b>Chats</b>
      <button id="chatnew" class="reset">+ New chat</button>
    </div>
    <div id="chatitems"></div>
    <div class="hint">Kept for this browser session. A reload starts fresh.</div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <footer>
    <button id="jump" class="jump" hidden title="Follow the answer again">
      Jump to latest <span aria-hidden="true">↓</span>
    </button>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Show oncalls from the last 2 days…"></textarea>
      <div class="composer-bar">
        <span class="enginewrap">
          <span class="enginedot" id="enginedot" aria-hidden="true"></span>
          <select id="engine" title="Which model answers" aria-label="Model"></select>
        </span>
        <span class="composer-actions">
          <button id="mic" class="mic" hidden aria-pressed="false" title="Dictate your question">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
              <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
              <path fill="currentColor" d="M18 12a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-2.1A8 8 0 0 0 20 12h-2z" />
            </svg>
            <span class="sr-only">Dictate</span>
          </button>
          <button id="send">Send</button>
        </span>
      </div>
    </div>
    <div class="hint" id="foot">Summaries derive from patient data — see docs/deploy.md before exposing this.</div>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    let busy = false;
    // Whatever is streaming right now. Aborting the fetch closes the SSE
    // connection, which is what the server watches for to kill its model call --
    // so Stop stops the work, not just the listening.
    let inFlight = null;

    function stopInFlight() {
      if (!inFlight) return false;
      const c = inFlight;
      inFlight = null;
      c.abort();
      return true;
    }

    function isAbort(err) {
      return err && (err.name === 'AbortError' || err.message === 'aborted');
    }
    // Conversation memory lives here and rides along on each request; the server
    // keeps no session state.
    const MAX_HISTORY = 8;
    let history = [];
    let greetingText = '';
    // Set from /api/context: no point offering a video that is not installed.
    let HAS_HELP_VIDEO = false;

    // The cold-start chips. Kept as the default for a fresh chat, and replaced
    // by suggestions drawn from the conversation once a turn has happened.
    const SUGGESTIONS = [
      "Show oncalls from the last 2 days",
      "Oncalls of 15th August 2026",
      "This week's oncalls",
      "Divide this week's oncalls into categories",
      "Summarize all of yesterday's oncalls",
    ];

    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    // Answers derive from untrusted email, so escape first and then allow exactly
    // two inline forms back in. Applied only on finalize -- a half-arrived '**'
    // would otherwise flicker.
    // Hosts whose links are ours: a label alone is enough, because where it
    // goes is not in question.
    const KNOWN_HOSTS = [
      '1mg.com', 'unifiedadmin.1mg.com', 'mail.google.com',
      '1mg-droplet-production-internal.s3.ap-south-1.amazonaws.com',
    ];

    function linkLabel(url) {
      let host = '', path = '';
      try {
        const u = new URL(url);
        host = u.hostname;
        path = u.pathname;
      } catch { return url; }

      const file = decodeURIComponent(path.split('/').filter(Boolean).pop() || '');
      const ext = (file.split('.').pop() || '').toLowerCase();
      const signed = /x-amz-signature|[?&]sig=|expires=/i.test(url);
      const trusted = KNOWN_HOSTS.some(h => host === h || host.endsWith('.' + h));

      let what = 'link';
      if (ext === 'pdf') what = signed ? 'signed report (PDF)' : 'report (PDF)';
      else if (ext === 'json') what = signed ? 'signed JSON report' : 'JSON report';
      else if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) what = 'image';
      else if (file) what = file.length > 28 ? file.slice(0, 25) + '…' : file;

      // An unknown host is always named. A link out of a support ticket must
      // never be able to look like one of ours.
      return trusted ? `open ${what}` : `open ${what} at ${host}`;
    }

    // A URL becomes a labelled link rather than a wall of characters. The full
    // URL stays in the title, and the host is in the label whenever it is not
    // one of ours -- this prose derives from untrusted email, so a link out of
    // a ticket has to be visibly not ours before it is clicked.
    function linkify(escaped) {
      return escaped.replace(/https?:\/\/[^\s<>"'`)]+/g, (match) => {
        // Trailing punctuation belongs to the sentence, not the URL.
        const trail = match.match(/[.,;:!?]+$/);
        const url = trail ? match.slice(0, -trail[0].length) : match;
        const raw = url.replace(/&amp;/g, '&');
        return `<a class="urlink" href="${raw}" target="_blank" rel="noopener noreferrer"`
          + ` title="${url}">${esc(linkLabel(raw))}<span class="ext" aria-hidden="true">\u2197</span></a>`
          + (trail ? trail[0] : '');
      });
    }

    function formatInline(text) {
      return linkify(esc(text))
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
        // The prompts ask for bold and code only, but a model still reaches for
        // italics now and then. Rendering it beats showing the reader asterisks.
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
        .replace(/`([^`\n]+)`/g, '<code>$1</code>');
    }

    // The model writes its diagnosis as a bullet list, so render one. Done line by
    // line on purpose: a line that is still arriving is already an <li> in its
    // final position, and only its inline marks resolve when it completes -- so
    // the finished panel looks exactly like the streaming one.
    function formatBlocks(text, streaming) {
      const lines = String(text || '').split('\n');
      let out = '', open = false, fenced = false;
      lines.forEach((raw, i) => {
        const line = raw.replace(/\s+$/, '');
        // Resolving a half-typed '**' would flicker, so the line in flight is
        // escaped only.
        const render = (t) => (streaming && i === lines.length - 1) ? esc(t) : formatInline(t);
        // ``` fences. The prompts ask for backticks and a local model reaches
        // for a fence anyway; without this the marker rendered as literal
        // ``` on its own line, with the content as ordinary prose.
        if (/^\s*```/.test(line)) {
          if (open) { out += '</ul>'; open = false; }
          out += fenced ? '</code></pre>' : '<pre class="block"><code>';
          fenced = !fenced;
          return;
        }
        if (fenced) { out += esc(raw) + '\n'; return; }
        if (!line.trim()) { if (open) { out += '</ul>'; open = false; } return; }
        const m = line.match(/^(\s*)[-*\u2022]\s+(.*)$/);
        if (m) {
          if (!open) { out += '<ul class="pts">'; open = true; }
          out += `<li${m[1].length >= 2 ? ' class="sub"' : ''}>${render(m[2])}</li>`;
        } else {
          if (open) { out += '</ul>'; open = false; }
          out += `<p>${render(line)}</p>`;
        }
      });
      if (open) out += '</ul>';
      // A fence still open is one the model has not closed yet.
      if (fenced) out += '</code></pre>';
      return out;
    }

    // What a follow-up needs in order to answer without re-reading Gmail.
    function compactRow(r) {
      const out = {
        thread_id: r.thread_id,
        subject: (r.subject || '').slice(0, 140),
        last_at: r.last_at || r.last_message_at || '',
      };
      if (r.messages != null) out.messages = r.messages;
      if ((r.order_ids || []).length) out.order_ids = r.order_ids;
      if ((r.attachments || []).length) out.attachments = r.attachments.length;
      if (r.severity) out.severity = r.severity;
      if (r.category) out.category = r.category;
      if (r.group) out.group = r.group;
      if (r.closed != null) out.closed = r.closed;
      if (r.issue) out.issue = String(r.issue).slice(0, 180);
      return out;
    }

    // A diagnosis the user opened after the fact belongs on that turn's row, so
    // "how many are closed" can be answered from the conversation.
    function noteDiagnosis(threadId, d) {
      for (const turn of history) {
        for (const row of (turn.rows || [])) {
          if (row.thread_id === threadId) {
            row.closed = !!d.thread_closed;
            row.closure_confidence = d.closure_confidence;
            if (d.closed_by) row.closed_by = d.closed_by;
            row.checks_failed = (d.checks || []).filter(c => !c.passed).length;
            if (d.runbook) row.runbook = d.runbook;
          }
        }
      }
    }

    // The same badge in both places, from the same fields: read from the thread,
    // never derived from anything else. Absent means nobody read it -- a summary
    // cached before this existed, say -- and that is not the same as open, so
    // nothing is shown.
    function stateBadge(s) {
      if (s == null || s.closed == null) return '';
      const closed = !!s.closed;
      const conf = typeof s.closure_confidence === 'number'
        ? ` · confidence ${s.closure_confidence.toFixed(2)}` : '';
      const who = closed && s.closed_by
        ? ` Closed by ${s.closed_by}${s.closed_at ? ` on ${s.closed_at}` : ''}.` : '';
      const why = s.closure_reason ? ` ${s.closure_reason}` : '';
      return `<span class="vd ${closed ? 'closed' : 'open'}" title="${esc(
        (closed ? 'A reply in the thread resolves it' : 'No reply in the thread clearly resolves it')
        + conf + who + why)}">${closed ? 'email closed' : 'email open'}</span>`;
    }

    function sourceBadge(src) {
      if (src === 'cache') return '<span class="src cache" title="Read from the local store; Gmail was not checked">local store</span>\n';
      if (src === 'gmail') return '<span class="src gmail" title="Fetched live from the Gmail API">live from gmail</span>\n';
      if (src === 'admin_api') return '<span class="src api" title="Read live from the internal admin APIs (read-only)">live from admin api</span>\n';
      if (src === 'context') return '<span class="src ctx" title="Answered from this conversation — nothing was re-fetched">from this chat</span>\n';
      return '';
    }

    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
    }

    async function copyText(text, el) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // Fallback for a non-secure context or a denied permission.
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch { toast('Could not copy'); ta.remove(); return; }
        ta.remove();
      }
      if (el) {
        // A class, not a text swap: the tick is generated content, so it
        // cannot end up inside whatever gets copied next.
        el.classList.add('copied');
        setTimeout(() => el.classList.remove('copied'), 900);
      }
      const shown = text.length > 48 ? text.slice(0, 45) + '…' : text;
      toast('Copied ' + shown);
    }

    // Text that is not a code chip but is still worth copying -- a subject, a
    // sender. Wrapped rather than given a button beside it: the words are the
    // control, and a widget next to every one of them was clutter.
    function copyable(text, label) {
      return `<span class="copytext" data-copy="${esc(text)}"`
        + ` title="Click to copy ${esc(label || 'this')}">${esc(text)}</span>`;
    }

    // Delegated once on the document: every code chip is click-to-copy, and any
    // element carrying data-copy copies that instead.
    document.addEventListener('click', (e) => {
      // A link is for following. Copying it instead would swallow the click.
      if (e.target.closest('a[href]')) return;
      const btn = e.target.closest('[data-copy]');
      if (btn) {
        e.preventDefault(); e.stopPropagation();
        copyText(btn.dataset.copy, btn);
        return;
      }
      const code = e.target.closest('code');
      if (code && code.textContent.trim()) {
        e.preventDefault();
        copyText(code.textContent.trim(), code);
      }
    }, true);

    function turn() { const t = document.createElement('div'); t.className = 'turn'; log.appendChild(t); return t; }
    // Streaming keeps the newest text in view -- until the reader scrolls up,
    // which means they are reading and cannot keep pace with the model. Then
    // it stops, and resumes only when they come back to the bottom.
    //
    // No flag is needed to tell a programmatic scroll from a real one: ours
    // lands AT the bottom, so the handler below recomputes to true and
    // stickiness survives it. A scroll that ends anywhere else was the reader.
    let stickToBottom = true;
    // Within a line or two of the end still counts as "at the bottom", so a
    // trackpad nudge does not switch autoscroll off.
    const BOTTOM_SLACK = 48;

    function atBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight <= BOTTOM_SLACK;
    }

    log.addEventListener('scroll', () => {
      stickToBottom = atBottom();
      syncJump();
    });

    function scroll(force) {
      if (!force && !stickToBottom) return;
      stickToBottom = true;
      log.scrollTop = log.scrollHeight;
      syncJump();
    }

    // Offered only when it is the answer they are missing: scrolled away while
    // one is still arriving. Scrolling back down by hand does the same thing.
    function syncJump() {
      const btn = document.getElementById('jump');
      if (btn) btn.hidden = stickToBottom || !busy;
    }

    function bubble(parent, cls, text) {
      const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
      parent.appendChild(d); scroll(); return d;
    }

    function idBlob(a) {
      if (!a) return '';
      const parts = [];
      for (const [k, v] of Object.entries(a)) {
        if (Array.isArray(v) && v.length) parts.push(...v.map(x => `<code>${esc(x)}</code>`));
      }
      // Joined with a space as well as laid out with gap: if the flex rule is
      // ever lost, inline wrapping still has somewhere to break.
      return parts.join(' ');
    }

    function summaryCard(s) {
      const sev = (s.severity || 'p3').toLowerCase();
      const ids = idBlob(s.affected);
      const extras = [];
      if (s.asks && s.asks.length) extras.push(['Asking for', s.asks]);
      if (s.missing_info && s.missing_info.length) extras.push(['Still needed', s.missing_info]);
      return `<div class="card">
    <h3><span class="pill ${sev}">${esc(sev.toUpperCase())}</span>
        <span class="sub">${esc(s.subject || '(no subject)')}</span></h3>
    <div class="cat">${esc(s.category || '')}${s.confidence != null ? ' · confidence ' + Number(s.confidence).toFixed(2) : ''}</div>
    ${stateBadge(s) ? `<div class="cstate">${stateBadge(s)}</div>` : ''}
    <div class="issue">${esc(s.issue || '')}</div>
    ${ids ? `<div class="ids">${ids}</div>` : ''}
    ${extras.length ? `<details class="more"><summary>Details</summary>${extras.map(([h, items]) => `<div><strong style="font-size:12px">${esc(h)}</strong><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')
          }${s.summary ? `<div><strong style="font-size:12px">Summary</strong><ul><li>${esc(s.summary)}</li></ul></div>` : ''}</details>` : ''}
    <div class="meta">
      ${s.reporter ? `<span>${esc(s.reporter)}</span>` : ''}
      ${s.suggested_owner ? `<span>→ ${esc(s.suggested_owner)}</span>` : ''}
      ${s.permalink ? `<a href="${esc(s.permalink)}" target="_blank" rel="noopener">open in Gmail</a>` : ''}
    </div>
  </div>`;
    }

    const DAY_MS = 86400000;

    function dayKey(iso) { return (iso || '').slice(0, 10); }

    function fmtDay(key) {
      if (!key) return 'Unknown date';
      const d = new Date(key + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function relDay(key) {
      if (!key) return '';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const d = new Date(key + 'T00:00:00');
      const n = Math.round((today - d) / DAY_MS);
      if (n === 0) return 'today';
      if (n === 1) return 'yesterday';
      if (n > 1 && n < 7) return n + ' days ago';
      return '';
    }

    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso.slice(11, 16);
      return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }

    function kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }

    function threadCard(t) {
      const atts = (t.attachments || []).map(a =>
        `<span class="att" data-copy="${esc(a.filename)}" title="Copy ${esc(a.filename)}"`
        + ` style="cursor:copy">${esc(a.filename)} · ${kb(a.size_bytes || 0)}</span>`).join('');
      const people = (t.participants || []).length > 1
        ? `<b>${esc(t.participants[0])}</b> + ${t.participants.length - 1} other${t.participants.length > 2 ? 's' : ''}`
        : `<b>${esc(t.opened_by || t.last_from || 'unknown')}</b>`;
      const span = (t.first_at && dayKey(t.first_at) !== dayKey(t.last_at))
        ? ` · opened ${esc(dayKey(t.first_at))}` : '';
      const label = t.has_summary ? 'Show summary' : 'Summarize';
      const cls = t.has_summary ? 'sumbtn cached' : 'sumbtn';

      return `<div class="tcard" data-thread="${esc(t.thread_id)}">
    <div class="top">
      <h3>${copyable(t.subject, 'subject')}</h3>
      <div class="time">${esc(fmtTime(t.last_at))}</div>
    </div>
    <div class="who">${people} · ${esc(t.messages)} message${t.messages == 1 ? '' : 's'}${span}</div>
    ${t.snippet ? `<div class="snip clamped">${esc(t.snippet)}</div>` : ''}
    ${atts ? `<div>${atts}</div>` : ''}
    <div class="foot">
      ${(t.attachments || []).length ? `<span class="chipm">${t.attachments.length} attachment${t.attachments.length == 1 ? '' : 's'}</span>` : ''}
      ${t.permalink ? `<a href="${esc(t.permalink)}" target="_blank" rel="noopener">open in Gmail</a>` : ''}
      <span class="spacer"></span>
      <button class="readbtn" data-act="read">Read thread</button>
      ${(t.order_ids || []).length ? `<button class="dxbtn" data-act="diagnose" data-order="${esc(t.order_ids[0])}" title="Check the edit-patient runbooks against ${esc(t.order_ids[0])}">Diagnose</button>` : ''}
      <button class="${cls}" data-act="summarize">${label}</button>
    </div>
    <div class="slot"></div>
  </div>`;
    }

    function threadList(rows) {
      // Grouped by the day of the latest message, newest day first.
      const groups = new Map();
      rows.forEach(r => {
        const k = dayKey(r.last_at);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(r);
      });
      const keys = [...groups.keys()].sort().reverse();
      return keys.map(k => {
        const rel = relDay(k);
        const items = groups.get(k)
          .sort((a, b) => (b.last_at || '').localeCompare(a.last_at || ''))
          .map(threadCard).join('');
        return `<div class="daygroup"><span class="d">${esc(fmtDay(k))}</span>` +
          (rel ? `<span class="rel">${esc(rel)}</span>` : '') +
          `<span class="rule"></span><span class="rel">${groups.get(k).length}</span></div>` +
          `<div class="cards">${items}</div>`;
      }).join('');
    }

    // One collapsed accordion section per category: the point of asking for
    // categories is the breakdown, so the counts are the answer and the cards are
    // the detail behind them. Every card is in the DOM, just hidden, so expanding
    // is instant and Summarize/Diagnose keep working on what was already opened.
    // The heading count is the number of cards actually rendered below it, so it
    // cannot disagree with what is shown.
    let accSeq = 0;
    function groupedList(groups, rows) {
      const byId = new Map((rows || []).map(r => [r.thread_id, r]));
      // A single category is not a breakdown -- there is nothing to choose
      // between, so it opens rather than hiding the whole answer behind a click.
      const single = (groups || []).length === 1;
      return (groups || []).map(g => {
        const list = (g.thread_ids || []).map(id => byId.get(id)).filter(Boolean)
          .sort((a, b) => (b.last_at || '').localeCompare(a.last_at || ''));
        if (!list.length) return '';
        const id = 'acc' + (++accSeq);
        return `<div class="acc${single ? ' open' : ''}">` +
          `<button class="acchead" type="button" aria-expanded="${single}" aria-controls="${id}">` +
          `<span class="chev">\u25b8</span>` +
          `<span class="lbl">${esc(g.label)}</span>` +
          `<span class="n">${list.length}</span>` +
          (g.description ? `<span class="desc">${esc(g.description)}</span>` : '') +
          `</button>` +
          `<div class="cards" id="${id}">${list.map(threadCard).join('')}</div>` +
          `</div>`;
      }).join('');
    }

    function timeline(label, created, changes) {
      if (!created && !(changes || []).length) return '';
      const rows = (changes || []).map(c =>
        `<li>${esc(c.from_value || '?')} → ${esc(c.to_value || '?')} at ${esc(c.changed_at || 'unknown')}`
        + (c.actor_id ? ` by <code>${esc(c.actor_id)}</code>` : '') + `</li>`).join('');
      return `<div class="tl"><div class="h">${esc(label)}</div>`
        + `<div style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">at creation: ${esc(created || 'unknown')}</div>`
        + (rows ? `<ul style="margin:4px 0 0 16px;padding:0">${rows}</ul>` : '') + `</div>`;
    }

    function code(v) { return v ? `<code>${esc(v)}</code>` : '<code>?</code>'; }

    function checkList(checks) {
      if (!(checks || []).length) return '';
      return `<ul class="checks">` + checks.map(c => {
        const ok = !!c.passed;
        return `<li>
      <span class="mk ${ok ? 'ok' : 'no'}" aria-hidden="true">${ok ? '✓' : '✗'}</span>
      <span class="lbl">${esc(c.label)}</span>
      <span class="sr-only">${ok ? 'passed' : 'failed'}</span>
      ${c.detail ? `<span class="why">${formatInline(c.detail)}</span>` : ''}
    </li>`;
      }).join('') + `</ul>`;
    }

    // One renderer for the whole life of the panel. While the diagnosis is still
    // arriving it is called with a partial `d` and `live`; when it finishes it is
    // called with the real one. Everything decided in code is therefore already in
    // its final position and final markup, and the last repaint only appends the
    // sections below the prose -- so the panel never jumps.
    function diagnosisPanel(d, ogid, live) {
      const streaming = !!(live && live.streaming);
      // No verdict yet: the thread has been read but the checks have not run.
      const v = (d.verdict || (streaming ? '' : 'indeterminate')).toLowerCase();
      const trim = t => String(t || '').replace(/\.+\s*$/, '');
      // Decided by reading the thread, not by the checks: a ticket can be closed
      // with a failed check, or open with every check passing.
      const closed = !!d.thread_closed;
      // Same badge as the summary shows, from the same reading of the thread.
      const state = stateBadge({
        closed: d.thread_closed == null ? null : closed,
        closure_confidence: d.closure_confidence,
        closed_by: d.closed_by, closed_at: d.closed_at,
      });
      const who = closed && d.closed_by
        ? ` Closed by ${esc(d.closed_by)}${d.closed_at ? ` on ${esc(d.closed_at)}` : ''}.` : '';
      const needs = (d.closure_reason || who)
        ? `<div class="dxnote">${d.closure_reason ? esc(trim(d.closure_reason)) + '.' : ''}${who}</div>`
        : '';

      // Last element, so it can disappear on the final repaint without moving
      // anything above it.
      const wait = (streaming && live.status)
        ? `<div class="sklabel dxwait">${esc(live.status)}</div>` : '';

      if (v === 'indeterminate') {
        return `<div class="dxwrap">
    <div class="panelhead"><span class="panelname">Diagnosis</span>${promptCta('diagnosis')}</div>
    ${traceBlock(live)}
      <span class="vd indeterminate">checks not run</span>
      ${state}
      ${needs}
      <div style="margin-top:8px">${formatBlocks(d.blocked_because || 'Could not establish anything.')}</div>
      ${d.auth_expired ? `<div class="sumerr" style="margin-top:6px">Your admin token has expired — re-copy it into <code>.env</code>.</div>` : ''}
      ${(d.trail || []).length ? `<div class="dxtrail">got as far as: ${esc((d.trail || []).join(' · '))}</div>` : ''}
      ${wait}
    </div>`;
      }

      const failed = (d.checks || []).filter(c => !c.passed).length;
      const badge = !v ? ''
        : failed
          ? `<span class="vd mismatch">${failed} check${failed > 1 ? 's' : ''} failed</span>`
          : `<span class="vd match">all checks passed</span>`;

      const steps = (d.resolution || []).map(x => `<li>${formatInline(x)}</li>`).join('');
      // Which prose this is was settled by the checks, before a word of it arrived.
      const prose = failed ? (d.reason || '') : (d.other_findings || '');
      const proseSec = !v ? '' : `<div class="dxsec">
      <div class="h">${failed ? 'Why it failed' : 'No runbook fired — what the evidence does show'}</div>
      <div data-slot="prose"${streaming ? ' class="tail"' : ''}>${formatBlocks(prose, streaming)}</div>
    </div>`;

      // The findings usually end by naming one further check. When a documented
      // read could answer it, it was run -- so this section shows what was called
      // and what came back, in the same shape as everything above it.
      const fq = d.followup_question || '';
      const calls = (d.followup_calls || []).map(c =>
        c.tool
          ? `<span class="fcall"><code>${esc(c.tool)}</code>${c.params ? ` <span class="fp">${esc(c.params)}</span>` : ''} → ${esc(c.outcome || '')}</span>`
          : `<span class="fcall none">${esc(c.outcome || '')}</span>`).join('');
      const followSec = (fq || d.followup_findings) ? `<div class="dxsec">
      <div class="h">Further check — run against the admin API</div>
      <div class="dxnote">${formatInline(fq)}</div>
      ${calls ? `<div class="fcalls">${calls}</div>` : ''}
      <div data-slot="followup"${(streaming && live.stage === 'followup') ? ' class="tail"' : ''}>${formatBlocks(d.followup_findings || '', streaming)}</div>
    </div>` : '';

      return `<div class="dxwrap">
    <div class="panelhead"><span class="panelname">Diagnosis</span>${promptCta('diagnosis')}</div>
    ${traceBlock(live)}
    ${badge}
    ${state}
    ${d.runbook ? `<span class="cat" style="margin-left:8px">${esc(d.runbook)}</span>` : ''}
    ${needs}
    ${checkList(d.checks)}
    ${proseSec}
    ${followSec}
    ${(!streaming && v && !failed && !d.other_findings) ? `<div class="dxnote">The report and the patient record agree, so neither runbook applies to ${code(ogid)}.</div>` : ''}
    ${timeline('Name history', d.name_created_as, d.name_changes)}
    ${timeline('Gender history', d.gender_created_as, d.gender_changes)}
    ${steps ? `<div class="dxsec"><div class="h">Resolution — dashboard only</div><ol class="steps">${steps}</ol></div>` : ''}
    ${streaming ? '' : `<div class="dxtrail">order ${code(ogid)} · patient ${code(d.patient_id)} · booking ${code(d.booking_id)}</div>`}
    ${wait}
  </div>`;
    }

    // Every response goes through here. A 401 is not an error to render in a
    // bubble: the session is gone, or the admin token is, and those need different
    // treatment -- one is a re-login, the other a paste that keeps the chat.
    class NeedsToken extends Error { }

    async function guard(res) {
      if (res.status !== 401) return res;
      let body = {};
      try { body = await res.json(); } catch { }
      if (body.reason === 'hra_missing') { throw new NeedsToken(body.detail || 'Admin token needed.'); }
      // Leave for the login page, saying why, and come back here afterwards.
      const q = new URLSearchParams({ err: body.reason || 'session_expired' });
      if (body.detail) q.set('detail', body.detail);
      location.replace('/login?' + q.toString());
      throw new Error(body.detail || 'Session expired.');
    }

    async function api(url, opts) {
      return guard(await fetch(url, opts));
    }

    // The admin bearer lives ~10h and is never written to disk, so it is asked for
    // when it is needed rather than at login: listing, reading and summarizing do
    const UNIFIED_ADMIN_URL = 'https://unifiedadmin.1mg.com/';

    // Linked by matching the phrase rather than by rendering links in general:
    // this same formatter runs over model output derived from untrusted email,
    // and a clickable link there would be a phishing vector.
    function withDashboardLink(html) {
      return html.replace(
        /unified-admin dashboard/g,
        `<a href="${UNIFIED_ADMIN_URL}" target="_blank" rel="noopener">unified-admin dashboard</a>`
      );
    }

    // not touch the admin API at all. The chat is left exactly as it was.
    function askForToken(message, onSaved) {
      const box = document.createElement('div');
      box.className = 'turn';
      box.innerHTML = `<div class="msg bot tokenask">
    <div class="tokhead"><b>Admin API token needed</b></div>
    <div class="hint">${withDashboardLink(formatBlocks(message || ''))}</div>
    <div class="tokrow">
      <input type="password" placeholder="Bearer …" autocomplete="off" spellcheck="false">
      <button class="sumbtn" data-act="save-token">Use it</button>
    </div>
    <div class="tokfoot">
      ${HAS_HELP_VIDEO ? '<button class="videocta" data-act="see-video"><span aria-hidden="true">\u25b6</span> How to get token — see this video</button>' : ''}
      <span class="hint">Held for this session only, never written to disk.</span>
    </div>
    <div class="sumerr" hidden></div>
  </div>`;
      log.appendChild(box);
      const video = box.querySelector('[data-act="see-video"]');
      if (video) video.onclick = () => showHelpVideo();
      const input = box.querySelector('input');
      const err = box.querySelector('.sumerr');
      input.focus(); scroll();

      const save = async () => {
        const token = input.value.trim();
        if (!token) { input.focus(); return; }
        input.disabled = true;
        try {
          const r = await api('/api/session', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hra_token: token })
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          box.remove();
          toast('Admin token saved for this session');
          if (onSaved) onSaved();
        } catch (e) {
          err.textContent = 'Could not save that: ' + e.message;
          err.hidden = false;
          input.disabled = false;
        }
      };
      box.querySelector('[data-act="save-token"]').onclick = save;
      input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    }

    // Both card CTAs stream over SSE, the same protocol the chat uses. Kept as an
    // async generator so the callers read as a plain loop over events.
    async function* sseEvents(url, body, signal) {
      const res = await api(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        // The edits ride along rather than being stored server-side.
        body: JSON.stringify({ ...body, prompts: promptEdits }), signal
      });
      if (!res.ok) {
        // A pre-flight failure (wrong account, unknown thread) is still a real
        // HTTP error, so it carries a detail worth showing verbatim.
        const d = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(d.detail || ('HTTP ' + res.status));
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) return;
        buf += dec.decode(value, { stream: true });
        const chunks = buf.split('\n\n'); buf = chunks.pop();
        for (const chunk of chunks) {
          let ev = 'message', data = '';
          for (const line of chunk.split('\n')) {
            if (line.startsWith('event: ')) ev = line.slice(7).trim();
            else if (line.startsWith('data: ')) data += line.slice(6);
          }
          if (!data) continue;
          try { yield [ev, JSON.parse(data)]; } catch { /* skip a partial frame */ }
        }
      }
    }

    // One renderer for the whole life of the panel, same as the diagnosis one, so
    // a summary that streamed in does not rearrange itself when it finishes.
    //
    // The order here is the order the model writes the fields in: the paragraph,
    // then the one-line issue, then the chips -- which is why the paragraph is
    // shown rather than folded into Details. Nothing that has already arrived
    // moves to make room for what comes next.
    function summaryPanel(s, live) {
      const streaming = !!(live && live.streaming);
      const sev = String(s.severity || '').toLowerCase();
      // The header row exists from the first paint, so filling it in later cannot
      // push the text below it down.
      // A placeholder pill, not a guessed severity: the real pill is taller than
      // bare text, so without it the header row grows by 10px when the severity
      // lands and pushes the paragraph down.
      const chips = sev
        ? `<span class="pill ${sev}">${esc(sev.toUpperCase())}</span>
       <span class="cat">${esc(s.category || '')}${s.confidence != null ? ' · confidence ' + Number(s.confidence).toFixed(2) : ''}</span>`
        : `<span class="pill pending">…</span><span class="cat">${streaming ? 'summarizing…' : ''}</span>`;
      const cursor = (name) => (streaming && live.field === name) ? ' tail' : '';
      const ids = idBlob(s.affected);
      const extras = [];
      if (s.asks && s.asks.length) extras.push(['Asking for', s.asks]);
      if (s.missing_info && s.missing_info.length) extras.push(['Still needed', s.missing_info]);
      // Reserved at its widest while streaming, so the verdict landing at the end
      // cannot wrap the header row and push the paragraph down.
      const verdict = stateBadge(s)
        || (streaming
          ? '<span class="vd closed" style="visibility:hidden" aria-hidden="true">email closed</span>'
          : '');
      return `<div class="sumwrap">
    <div class="panelhead"><span class="panelname">Summary</span>${promptCta('summary')}</div>
    ${traceBlock(live)}
    <div class="hdr">${chips}${verdict}</div>
    <div data-slot="summary" class="sumtext${cursor('summary')}">${formatBlocks(s.summary || '', streaming)}</div>
    <div data-slot="issue" class="livemeta${cursor('issue')}">${s.issue ? formatInline(s.issue) : ''}</div>
    ${ids ? `<div class="ids">${ids}</div>` : ''}
    ${extras.length ? `<details class="more"><summary>Details</summary>${extras.map(([h, items]) => `<div><strong style="font-size:12px">${esc(h)}</strong><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')
          }</details>` : ''}
    ${s.suggested_owner ? `<div class="meta">→ ${esc(s.suggested_owner)}</div>` : ''}
    ${(streaming && live.status) ? `<div class="sklabel dxwait">${esc(live.status)}</div>` : ''}
  </div>`;
    }

    const backdrop = document.getElementById('backdrop');
    const mbody = document.getElementById('mbody');
    let lastFocus = null;

    const THREAD_SKELETON = `<div class="emsg">
  <div class="sk w35"></div><div class="sk w20"></div>
  <div class="sk w95"></div><div class="sk w95"></div><div class="sk w80"></div>
</div><div class="emsg">
  <div class="sk w35"></div><div class="sk w20"></div>
  <div class="sk w95"></div><div class="sk w60"></div>
</div>`;

    // The same modal the thread reader uses, so Esc / × / backdrop all work.
    function showHelpVideo() {
      document.getElementById('mtitle').textContent = 'Where to find the admin token';
      // The modal is shared with the thread reader, whose Gmail link means
      // nothing here.
      document.getElementById('mlink').hidden = true;
      mbody.innerHTML = `<div class="helpvid">
    <video controls autoplay playsinline preload="metadata" src="/help/admin-token">
      Your browser cannot play this video.
    </video>
    <div class="hint">unified-admin → DevTools → Application → Local Storage →
      <code>accessToken</code></div>
  </div>`;
      openModal();
    }

    // --- editing the prompt behind an answer ------------------------------
    //
    // A prompt is behaviour, so the fastest way to fix a bad answer is to
    // change the words and ask again. Edits live here, in memory: they travel
    // with each request, a refresh resets them, and nothing is written down --
    // one person's experiment cannot outlive their tab or reach anyone else.
    const promptEdits = {};
    let promptCatalog = null;

    async function loadPromptCatalog() {
      if (promptCatalog) return promptCatalog;
